<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOI4 戰略指揮部</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1b1e;color:#e3e5e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#4a4d53;border-radius:3px}
  ::-webkit-scrollbar-track{background:transparent}
  .panel{background:#2b2d31;border-radius:12px;padding:16px}
  .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
  .btn-primary{background:#5865f2;color:#fff}
  .btn-primary:hover{background:#4752c4}
  .btn-green{background:#3ba55d;color:#fff}
  .btn-green:hover{background:#2d7d46}
  .btn-red{background:#ed4245;color:#fff}
  .btn-red:hover{background:#c23a3d}
  .btn-ghost{background:#3a3c43;color:#e3e5e8}
  .btn-ghost:hover{background#4a4d53}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  input,select{background:#1e1f22;color:#e3e5e8;border:1px solid#3a3c43;border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
  input:focus{border-color:#5865f2}
  .fade-in{animation:fi .2s ease}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  svg .province{cursor:pointer;transition:opacity .15s}
  svg .province:hover{opacity:.85}
  svg .province.selected{stroke:#fff;stroke-width:2;stroke-opacity:1}
  svg .province.movable{stroke:#3ba55d;stroke-width:2;stroke-dasharray:4 2;stroke-opacity:.8}
  .div-marker{pointer-events:none}
  .tooltip{position:absolute;background:#1e1f22;border:1px solid#3a3c43;border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;z-index:50;max-width:240px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
</style>
</head>
<body>

<!-- Nav -->
<nav style="background:#2b2d31;border-bottom:1px solid#1e1f22;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10">
  <div style="display:flex;align-items:center;gap:12px">
    <span style="font-size:18px;font-weight:700">🎭 戰略指揮部</span>
    <span id="nav-info" style="font-size:12px;color:#949ba4"></span>
  </div>
  <div id="nav-user" style="display:flex;align-items:center;gap:10px;font-size:13px"></div>
</nav>

<div id="main" style="max-width:1400px;margin:0 auto;padding:16px;display:flex;gap:16px;flex-wrap:wrap">

  <!-- LEFT: Map -->
  <div style="flex:1;min-width:600px">
    <div class="panel" style="position:relative">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:600;font-size:15px">🗺️ 戰略地圖</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost" onclick="refresh()">🔄</button>
        </div>
      </div>
      <div id="map-container" style="position:relative">
        <svg id="map-svg" viewBox="0 0 1000 500" style="width:100%;background:#0d0e11;border-radius:8px;display:block"></svg>
        <div id="tooltip" class="tooltip"></div>
      </div>
      <div id="province-detail" style="margin-top:10px;font-size:13px;color:#949ba4;min-height:40px"></div>
    </div>

    <!-- War panel -->
    <div class="panel" style="margin-top:12px" id="war-panel">
      <div style="font-weight:600;font-size:15px;margin-bottom:8px">⚔️ 戰爭狀態</div>
      <div id="war-list"></div>
    </div>

    <!-- Log -->
    <div class="panel" style="margin-top:12px">
      <div style="font-weight:600;font-size:15px;margin-bottom:8px">📜 戰報</div>
      <div id="log-list" style="max-height:140px;overflow-y:auto;font-size:12px;color:#949ba4;line-height:1.6"></div>
    </div>
  </div>

  <!-- RIGHT: Control panels -->
  <div style="width:400px;display:flex;flex-direction:column;gap:12px">
    
    <!-- Login / Join -->
    <div class="panel" id="login-panel">
      <div id="login-content"></div>
    </div>

    <!-- My Country -->
    <div class="panel" id="my-country-panel" style="display:none">
      <div style="font-weight:600;font-size:15px;margin-bottom:10px" id="my-country-title"></div>
      <div id="my-country-stats" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px"></div>
      
      <!-- Tabs -->
      <div style="display:flex;gap:4px;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-ghost tab-btn" data-tab="focus" onclick="switchTab('focus')" style="font-size:12px;padding:6px 10px">國策</button>
        <button class="btn btn-ghost tab-btn" data-tab="research" onclick="switchTab('research')" style="font-size:12px;padding:6px 10px">研究</button>
        <button class="btn btn-ghost tab-btn" data-tab="build" onclick="switchTab('build')" style="font-size:12px;padding:6px 10px">建設</button>
        <button class="btn btn-ghost tab-btn" data-tab="produce" onclick="switchTab('produce')" style="font-size:12px;padding:6px 10px">生產</button>
        <button class="btn btn-ghost tab-btn" data-tab="divisions" onclick="switchTab('divisions')" style="font-size:12px;padding:6px 10px">部隊</button>
        <button class="btn btn-ghost tab-btn" data-tab="templates" onclick="switchTab('templates')" style="font-size:12px;padding:6px 10px">編制</button>
      </div>

      <div id="tab-content" style="margin-top:10px;min-height:80px"></div>
    </div>

    <!-- Countries overview -->
    <div class="panel">
      <div style="font-weight:600;font-size:15px;margin-bottom:8px">🌍 各國概況</div>
      <div id="countries-list" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:20px;right:20px;background:#2b2d31;border-radius:8px;padding:12px 20px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.4);display:none;z-index:100;max-width:360px"></div>

<script>
// ── API helper ──
async function api(path, method, body) {
  try {
    const opts = {method: method||'GET', headers: {'Content-Type':'application/json'}};
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return {error: data.error || ('HTTP '+res.status)};
    return data;
  } catch(e) { return {error: e.message}; }
}

// ── State ──
let S = null;       // game state
let me = null;       // {user_id, username, avatar_url}
let myCid = null;     // my country id
let selProv = null;   // selected province id
let selDiv = null;    // selected division id (for moving)
let curTab = 'focus';

const TERRAIN_COLORS = {
  plains: '#7a9e4a', mountains: '#8b7355', forest: '#4a7a3a',
  urban: '#6b6b6b', desert: '#c4a86a'
};
const WAR_ICONS = { attacker: '⚔️', defender: '🛡️' };

// ── Init ──
async function init() {
  // Check login
  const userRes = await api('/api/me');
  if (userRes.error) {
    renderLoginPrompt();
  } else {
    me = userRes;
    renderUserInfo();
  }
  await refresh();
  // Auto-refresh every 20s
  setInterval(refresh, 20000);
}

function renderLoginPrompt() {
  document.getElementById('login-content').innerHTML = `
    <div style="font-weight:600;font-size:15px;margin-bottom:8px">🔐 登入</div>
    <p style="color:#949ba4;font-size:13px;margin-bottom:10px">用 Discord 帳號登入後即可加入遊戲、操作你的國家。不用手動輸入 ID。</p>
    <a href="/login?next=/hoi4" class="btn btn-primary" style="text-decoration:none;display:inline-block">用 Discord 登入</a>
  `;
  document.getElementById('login-panel').style.display = '';
  document.getElementById('my-country-panel').style.display = 'none';
}

function renderUserInfo() {
  const avatar = me.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png';
  document.getElementById('nav-user').innerHTML = `
    <img src="${avatar}" style="width:28px;height:28px;border-radius:50%" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
    <span>${me.username}</span>
    <a href="/logout" style="color:#949ba4;font-size:12px;text-decoration:none">登出</a>
  `;
}

// ── Refresh state ──
async function refresh() {
  const s = await api('/api/game/hoi4/state');
  if (s.error) { toast('載入失敗: '+s.error); return; }
  S = s;
  document.getElementById('nav-info').textContent = s.game_active
    ? `Day ${s.tick||0} · ${Object.keys(s.countries||{}).length} 國 · ${Object.keys(s.wars||{}).length} 戰爭`
    : '等待第一位玩家加入即可開始';

  // Find my country
  myCid = null;
  if (me) {
    for (const [cid, c] of Object.entries(S.countries||{})) {
      if (c.owner === me.user_id) { myCid = cid; break; }
    }
  }

  renderLoginOrJoin();
  renderMap();
  renderCountries();
  renderWars();
  renderLog();
  if (myCid) {
    document.getElementById('my-country-panel').style.display = '';
    renderMyCountry();
    renderTab();
  } else {
    document.getElementById('my-country-panel').style.display = 'none';
  }
}

// ── Login / Join panel ──
function renderLoginOrJoin() {
  if (!me) return; // login prompt already shown

  if (myCid) {
    document.getElementById('login-panel').style.display = 'none';
    return;
  }

  document.getElementById('login-panel').style.display = '';
  if (pickingStart) {
    document.getElementById('login-content').innerHTML = `
      <div style="font-weight:600;font-size:15px;margin-bottom:8px">🗺️ 選擇起始地區</div>
      <p style="color:#949ba4;font-size:13px;margin-bottom:10px">在地圖上點一個<b style="color:#fee75c">金色邊框</b>的無主省份當作起始地。</p>
      ${pickedProv ? `<div style="background:#1e1f22;border-radius:6px;padding:8px;margin-bottom:8px">已選擇：<b>${S.provinces[pickedProv].name}</b></div>` : '<div style="color:#949ba4;font-size:12px">還沒選擇...</div>'}
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="confirmJoin()" ${pickedProv?'':'disabled'}>✅ 在此建國</button>
        <button class="btn btn-ghost" onclick="cancelPickStart()">取消</button>
      </div>
      <div id="join-msg" style="margin-top:6px;font-size:12px;color:#ed4245"></div>
    `;
    return;
  }
  document.getElementById('login-content').innerHTML = `
    <div style="font-weight:600;font-size:15px;margin-bottom:8px">🚩 加入遊戲</div>
    <p style="color:#949ba4;font-size:13px;margin-bottom:10px">沒有人數上限，不用報名，隨時可加入。從一個省份開始，之後可以和平擴張或發動戰爭慢慢長大。</p>
    <div style="display:flex;gap:8px">
      <input id="join-name" type="text" placeholder="你的國家名稱" style="flex:1" onkeydown="if(event.key==='Enter')startPickLocation()">
      <button class="btn btn-primary" onclick="startPickLocation()">🗺️ 選地建國</button>
    </div>
    <div id="join-msg" style="margin-top:6px;font-size:12px;color:#ed4245"></div>
  `;
}

let pickingStart = false;
let pickedProv = null;
let pendingCountryName = '';

function startPickLocation() {
  const name = document.getElementById('join-name').value.trim();
  if (!name) { document.getElementById('join-msg').textContent = '請輸入國家名稱'; return; }
  pendingCountryName = name;
  pickingStart = true;
  pickedProv = null;
  renderLoginOrJoin();
  renderMap();
  toast('在地圖上點選一個無主省份（金色邊框）當起始地');
}

function cancelPickStart() {
  pickingStart = false;
  pickedProv = null;
  renderLoginOrJoin();
  renderMap();
}

async function confirmJoin() {
  if (!pickedProv) return;
  const r = await api('/api/game/hoi4/join', 'POST', { user_id: me.user_id, name: pendingCountryName, start_province: pickedProv });
  if (r.error) { document.getElementById('join-msg').textContent = r.error; return; }
  pickingStart = false;
  pickedProv = null;
  toast('建國成功！起始地：' + S.provinces[r.country.provinces_owned[0]].name);
  await refresh();
}

// ── Map rendering ──
function renderMap() {
  if (!S || !S.provinces) return;
  const svg = document.getElementById('map-svg');
  let parts = '';

  // Background water
  parts += `<rect x="0" y="0" width="1000" height="500" fill="#0d1117"/>`;

  // Draw provinces
  for (const [pid, p] of Object.entries(S.provinces)) {
    const polyStr = (p.polygon||[]).map(pt => pt[0]+','+pt[1]).join(' ');
    if (!polyStr) continue;
    const owner = S.countries[p.owner];
    let fill = TERRAIN_COLORS[p.type] || '#5a5a5a';
    if (owner) fill = owner.color || fill;
    fill = fill;
    const opacity = owner ? 0.75 : 0.5;
    const sel = (pid === selProv || pid === pickedProv) ? ' selected' : '';
    const movable = (selDiv && myCid && selProv && isAdjacent(selProv, pid)) ? ' movable' : '';
    const pickable = (pickingStart && !owner) ? ' movable' : '';
    let extraStroke = '';
    if (pickingStart && !owner) extraStroke = 'stroke="#fee75c" stroke-width="1.2" stroke-opacity="0.9"';

    parts += `<polygon class="province${sel}${movable}${pickable}" points="${polyStr}" fill="${fill}" fill-opacity="${opacity}" ${extraStroke || 'stroke="#2a2a2a" stroke-width="0.5" stroke-opacity="0.6"'} onclick="onProvinceClick('${pid}')" onmousemove="showTooltip(event,'${pid}')" onmouseout="hideTooltip()"/>`;

    // Province name — 世界地圖省份很多，小國/無主省份不擠標籤，只在擁有國家或夠大時顯示，避免密密麻麻看不清楚
    const [cx, cy] = p.centroid || [0,0];
    const xs = (p.polygon||[]).map(pt=>pt[0]), ys = (p.polygon||[]).map(pt=>pt[1]);
    const bboxW = xs.length ? Math.max(...xs)-Math.min(...xs) : 0;
    const bboxH = ys.length ? Math.max(...ys)-Math.min(...ys) : 0;
    const bigEnough = Math.max(bboxW, bboxH) > 14;
    if (owner || bigEnough) {
      const fontSize = owner ? 9 : 8;
      parts += `<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#fff" fill-opacity="0.9" font-size="${fontSize}" style="pointer-events:none;font-weight:600;paint-order:stroke;stroke:#000;stroke-width:2;stroke-opacity:0.5">${p.name}</text>`;
    }

    // VP star
    if (p.victory_points > 0) {
      parts += `<text x="${cx+14}" y="${cy-4}" text-anchor="middle" fill="#fee75c" font-size="10" style="pointer-events:none">★</text>`;
    }

    // Division markers
    if (owner) {
      const divs = (owner.divisions||[]).filter(d => d.province === pid);
      if (divs.length > 0) {
        const avgStr = divs.reduce((s,d) => s + (d.strength||0), 0) / divs.length;
        const strColor = avgStr > 0.7 ? '#3ba55d' : avgStr > 0.3 ? '#fee75c' : '#ed4245';
        parts += `<circle class="div-marker" cx="${cx}" cy="${cy+8}" r="5" fill="${owner.color}" stroke="${strColor}" stroke-width="1.5"/>`;
        parts += `<text class="div-marker" x="${cx}" y="${cy+11}" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">${divs.length}</text>`;
      }
    }

    // Fortification
    if (p.fortifications > 0) {
      parts += `<text x="${cx-12}" y="${cy+12}" text-anchor="middle" fill="#ed4245" font-size="10" style="pointer-events:none">🛡</text>`;
    }
  }

  // Draw war borders (red dashed lines between contested provinces)
  for (const [wid, war] of Object.entries(S.wars||{})) {
    const atkC = S.countries[war.attacker];
    const defC = S.countries[war.defender];
    if (!atkC || !defC) continue;
    const atkPids = new Set(atkC.provinces_owned||[]);
    const defPids = new Set(defC.provinces_owned||[]);
    for (const pid of atkPids) {
      const prov = S.provinces[pid];
      if (!prov) continue;
      for (const nPid of (prov.neighbors||[])) {
        if (defPids.has(nPid)) {
          const nProv = S.provinces[nPid];
          if (!nProv) continue;
          const [x1,y1] = prov.centroid||[0,0];
          const [x2,y2] = nProv.centroid||[0,0];
          parts += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ed4245" stroke-width="2" stroke-dasharray="6 3" opacity="0.7" style="pointer-events:none"/>`;
        }
      }
    }
  }

  svg.innerHTML = parts;
}

function isAdjacent(fromPid, toPid) {
  const p = S.provinces[fromPid];
  if (!p) return false;
  return (p.neighbors||[]).includes(toPid);
}

function onProvinceClick(pid) {
  const prov = S.provinces[pid];
  if (!prov) return;

  // Picking a starting location for a new country
  if (pickingStart) {
    if (prov.owner) { toast('這個省份已經有主人了，選別的地方'); return; }
    pickedProv = pid;
    renderLoginOrJoin();
    renderMap();
    return;
  }

  // If we have a division selected and this is adjacent, move it
  if (selDiv && myCid && selProv && isAdjacent(selProv, pid)) {
    moveDivision(selDiv, pid);
    return;
  }

  // Otherwise just select the province
  selProv = pid;
  selDiv = null;
  renderProvinceDetail(pid);
  renderMap();

  // If this is my province and has divisions, show division selector
  if (myCid && prov.owner === myCid) {
    const c = S.countries[myCid];
    const divs = (c.divisions||[]).filter(d => d.province === pid);
    if (divs.length > 0) {
      renderDivisionSelector(divs);
    }
  }

  // If this is an unowned province adjacent to my territory, offer peaceful expansion
  if (myCid && !prov.owner) {
    const c = S.countries[myCid];
    const owned = new Set(c.provinces_owned||[]);
    const isAdjacentToMine = (prov.neighbors||[]).some(n => owned.has(n));
    if (isAdjacentToMine) {
      document.getElementById('province-detail').innerHTML += `<div style="margin-top:8px">
        <button class="btn btn-green" onclick="doExpand('${pid}')">🌱 和平擴張至此（花費 ${EXPAND_PP_COST} 政治點數）</button>
      </div>`;
    }
  }

  // If this is an enemy province, offer war declaration shortcut
  if (myCid && prov.owner && prov.owner !== myCid) {
    const c = S.countries[myCid];
    const alreadyAtWar = (c.at_war_with||[]).includes(prov.owner);
    if (!alreadyAtWar) {
      const enemy = S.countries[prov.owner];
      document.getElementById('province-detail').innerHTML += `<div style="margin-top:8px">
        <button class="btn btn-red" onclick="doDeclareWar('${prov.owner}')">⚔️ 向 ${enemy.name} 宣戰</button>
      </div>`;
    }
  }
}

const EXPAND_PP_COST = 30;

async function doExpand(pid) {
  const r = await api('/api/game/hoi4/expand', 'POST', { country_id: myCid, province: pid });
  if (r.error) { toast(r.error); return; }
  toast('擴張成功！');
  await refresh();
}

async function doDeclareWar(targetId) {
  const r = await api('/api/game/hoi4/declare-war', 'POST', { country_id: myCid, target_id: targetId });
  if (r.error) { toast(r.error); return; }
  toast('已宣戰！');
  await refresh();
}

function renderProvinceDetail(pid) {
  const p = S.provinces[pid];
  if (!p) { document.getElementById('province-detail').innerHTML = ''; return; }
  const owner = S.countries[p.owner];
  const ownerName = owner ? `<span style="color:${owner.color};font-weight:600">${owner.name}</span>` : '<span style="color:#949ba4">無主</span>';
  const res = Object.entries(p.resources||{}).map(([k,v]) => `${k}:${v}`).join(' · ') || '無';
  const terrainMap = {plains:'平原',mountains:'山地',forest:'森林',urban:'都市',desert:'沙漠'};
  let html = `<b>${p.name}</b> · ${terrainMap[p.type]||p.type} · ${ownerName}<br>` +
    `<span style="font-size:12px">基建:${p.infrastructure} · 工事:${p.fortifications} · 資源:${res}` +
    (p.victory_points > 0 ? ` · VP:${p.victory_points}` : '') + `</span>`;
  
  // Show neighbors
  const neighbors = (p.neighbors||[]).map(n => {
    const np = S.provinces[n];
    return np ? np.name : n;
  }).join('、');
  html += `<br><span style="font-size:11px;color:#949ba4">鄰接: ${neighbors}</span>`;
  document.getElementById('province-detail').innerHTML = html;
}

function renderDivisionSelector(divs) {
  let html = '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">';
  for (const d of divs) {
    const tpl = (S.countries[myCid].division_templates||[]).find(t => t.id === d.template_id);
    const name = tpl ? tpl.name : d.template_id;
    const strPct = Math.floor((d.strength||0)*100);
    const strColor = strPct > 70 ? '#3ba55d' : strPct > 30 ? '#fee75c' : '#ed4245';
    html += `<button class="btn btn-ghost" onclick="selectDiv('${d.id}')" style="font-size:12px;padding:5px 10px;border:1px solid ${strColor}">` +
      `${name} · 戰力${strPct}% · 組織${d.org||0}</button>`;
  }
  html += '</div>';
  document.getElementById('province-detail').innerHTML += html;
}

function selectDiv(divId) {
  selDiv = divId;
  toast('已選擇部隊，點擊相鄰省份（綠色虛線）移防');
  renderMap();
}

async function moveDivision(divId, toPid) {
  const r = await api('/api/game/hoi4/move-division', 'POST', {
    country_id: myCid, division_id: divId, province: toPid
  });
  if (r.error) { toast(r.error); return; }
  selDiv = null;
  selProv = toPid;
  toast('部隊已移防');
  await refresh();
}

function showTooltip(e, pid) {
  const p = S.provinces[pid];
  if (!p) return;
  const owner = S.countries[p.owner];
  const terrainMap = {plains:'平原',mountains:'山地',forest:'森林',urban:'都市',desert:'沙漠'};
  let html = `<b>${p.name}</b><br>地形: ${terrainMap[p.type]||p.type}`;
  if (owner) html += `<br>屬於: ${owner.name}`;
  const divs = owner ? (owner.divisions||[]).filter(d => d.province === pid) : [];
  if (divs.length > 0) html += `<br>駐軍: ${divs.length} 師`;
  const tt = document.getElementById('tooltip');
  tt.innerHTML = html;
  tt.style.display = 'block';
  tt.style.left = (e.offsetX + 15) + 'px';
  tt.style.top = (e.offsetY + 15) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ── My country rendering ──
function renderMyCountry() {
  if (!myCid || !S.countries[myCid]) return;
  const c = S.countries[myCid];
  document.getElementById('my-country-title').innerHTML = `<span style="color:${c.color}">${c.name}</span>`;

  const focusName = c.current_focus
    ? (() => { const f = (S.focus_tree||[]).find(x => x.id === c.current_focus); const pct = f ? Math.min(100, Math.floor((c.focus_progress||0)/(f.cost||70)*100)) : 0; return (f ? f.name : c.current_focus) + ' ('+pct+'%)'; })()
    : '無';

  const stats = [
    ['政治點數', Math.floor(c.political_power||0)],
    ['穩定度', Math.floor((c.stability||0)*100) + '%'],
    ['民工', c.civilian_factories||0],
    ['軍工', c.military_factories||0],
    ['兵員', c.manpower||0],
    ['部隊', (c.divisions||[]).length + ' 師'],
    ['領土', (c.provinces_owned||[]).length + ' 省'],
    ['國策', focusName],
    ['研究', (c.research||[]).length + '/' + (c.research_slots||3)],
    ['狀態', c.at_war_with && c.at_war_with.length > 0 ? '⚔️ 戰爭中' : '☮️ 和平'],
  ];
  document.getElementById('my-country-stats').innerHTML = stats.map(([k,v]) =>
    `<div style="background:#1e1f22;border-radius:6px;padding:6px 10px"><div style="color:#949ba4;font-size:11px">${k}</div><div style="font-weight:600">${v}</div></div>`
  ).join('');
}

// ── Tabs ──
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.style.background = b.dataset.tab === tab ? '#5865f2' : '#3a3c43';
    b.style.color = b.dataset.tab === tab ? '#fff' : '#e3e5e8';
  });
  renderTab();
}

function renderTab() {
  if (!myCid) return;
  const c = S.countries[myCid];
  if (!c) return;
  const el = document.getElementById('tab-content');

  if (curTab === 'focus') renderFocusTab(c, el);
  else if (curTab === 'research') renderResearchTab(c, el);
  else if (curTab === 'build') renderBuildTab(c, el);
  else if (curTab === 'produce') renderProduceTab(c, el);
  else if (curTab === 'divisions') renderDivisionsTab(c, el);
  else if (curTab === 'templates') renderTemplatesTab(c, el);
}

function renderFocusTab(c, el) {
  const tree = S.focus_tree || [];
  if (c.current_focus) {
    const f = tree.find(x => x.id === c.current_focus);
    const pct = f ? Math.min(100, Math.floor((c.focus_progress||0)/(f.cost||70)*100)) : 0;
    el.innerHTML = `<div style="color:#949ba4;font-size:13px">進行中: <b>${f ? f.name : c.current_focus}</b> (${pct}%)</div>`;
    return;
  }
  // Show available focuses (prereq met)
  const completed = new Set(c.completed_focuses||[]);
  const available = tree.filter(f => !completed.has(f.id) && (f.prereq||[]).every(p => completed.has(p)));
  if (available.length === 0) { el.innerHTML = '<div style="color:#949ba4">所有國策已完成！</div>'; return; }
  el.innerHTML = available.map(f => {
    const effects = Object.entries(f.effects||{}).map(([k,v]) => `${k}: +${v}`).join(', ');
    return `<button class="btn btn-ghost" onclick="setFocus('${f.id}')" style="width:100%;text-align:left;margin-bottom:4px;padding:8px 12px">
      <b>${f.name}</b> <span style="color:#949ba4;font-size:11px">(${f.cost}天)</span><br>
      <span style="font-size:11px;color:#949ba4">${f.desc||''} — ${effects}</span>
    </button>`;
  }).join('');
}

async function setFocus(focusId) {
  const r = await api('/api/game/hoi4/set-focus', 'POST', { country_id: myCid, focus_id: focusId });
  if (r.error) { toast(r.error); return; }
  toast('國策已設定');
  await refresh();
}

function renderResearchTab(c, el) {
  const tree = S.tech_tree || {};
  const researching = new Set((c.research||[]).map(r => r.tech_id));
  const slotsFull = (c.research||[]).length >= (c.research_slots||3);
  
  let html = '';
  for (const [cat, techs] of Object.entries(tree)) {
    const catName = {industry:'工業',army:'陸軍',air:'空軍',naval:'海軍'}[cat] || cat;
    html += `<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#949ba4;margin-bottom:4px">${catName}</div>`;
    for (const t of techs) {
      const done = (c.completed_tech||{}).hasOwnProperty(t.id) || researching.has(t.id);
      const prereqMet = !t.prereq || (c.completed_tech||{}).hasOwnProperty(t.prereq) || researching.has(t.prereq);
      const canResearch = !done && prereqMet && !slotsFull;
      const inProgress = researching.has(t.id);
      let btn = '';
      if (inProgress) {
        const r = (c.research||[]).find(x => x.tech_id === t.id);
        const pct = Math.min(100, Math.floor((r.progress||0)/(t.cost||100)*100));
        btn = `<span class="tag" style="background:#5865f2">研究中 ${pct}%</span>`;
      } else if (done) {
        btn = `<span class="tag" style="background:#3ba55d">已完成</span>`;
      } else if (!prereqMet) {
        btn = `<span class="tag" style="background:#3a3c43">需先研究${t.prereq}</span>`;
      } else if (slotsFull) {
        btn = `<span class="tag" style="background:#3a3c43">研究槽已滿</span>`;
      } else {
        btn = `<button class="btn btn-primary" onclick="doResearch('${cat}','${t.id}')" style="font-size:11px;padding:4px 10px">研究</button>`;
      }
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px">
        <span>${t.name} <span style="color:#949ba4;font-size:10px">(${t.cost})</span></span>${btn}</div>`;
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

async function doResearch(cat, techId) {
  const r = await api('/api/game/hoi4/research', 'POST', { country_id: myCid, category: cat, tech_id: techId });
  if (r.error) { toast(r.error); return; }
  toast('研究已開始');
  await refresh();
}

function renderBuildTab(c, el) {
  const costs = {civilian_factory:'民工(100)',military_factory:'軍工(100)',fortification:'工事(80)',infrastructure:'基建(60)'};
  let html = '<div style="font-size:12px;color:#949ba4;margin-bottom:6px">點選你的省份（地圖上），然後選擇建設類型：</div>';
  if (!selProv || !(c.provinces_owned||[]).includes(selProv)) {
    html += '<div style="color:#949ba4;font-size:12px">請先在地圖上點選你的省份</div>';
  } else {
    html += `<div style="margin-bottom:8px">已選: <b>${S.provinces[selProv].name}</b></div>`;
    for (const [type, label] of Object.entries(costs)) {
      html += `<button class="btn btn-ghost" onclick="doBuild('${type}','${selProv}')" style="width:100%;text-align:left;margin-bottom:3px;padding:6px 10px;font-size:12px">${label}</button>`;
    }
  }
  // Show build queue
  if (c.construction_queue && c.construction_queue.length > 0) {
    html += '<div style="margin-top:8px;font-size:12px;font-weight:600">建設序列:</div>';
    for (const q of c.construction_queue) {
      const pct = Math.min(100, Math.floor((q.progress||0)/(q.cost||100)*100));
      const tName = costs[q.type] ? costs[q.type].split('(')[0] : q.type;
      html += `<div style="font-size:11px;color:#949ba4">${tName} @ ${q.province} — ${pct}%</div>`;
    }
  }
  el.innerHTML = html;
}

async function doBuild(type, province) {
  const r = await api('/api/game/hoi4/build', 'POST', { country_id: myCid, type: type, province: province });
  if (r.error) { toast(r.error); return; }
  toast('建設已排程');
  await refresh();
}

function renderProduceTab(c, el) {
  const tpls = c.division_templates || [];
  let html = '<div style="font-size:12px;color:#949ba4;margin-bottom:6px">選擇模板和軍工數開始生產：</div>';
  for (const t of tpls) {
    html += `<div style="background:#1e1f22;border-radius:6px;padding:8px;margin-bottom:6px">`;
    html += `<div style="font-weight:600;font-size:13px">${t.name} <span style="color:#949ba4;font-size:10px">成本:${t.cost||100}</span></div>`;
    html += `<div style="font-size:11px;color:#949ba4">攻:${(t.stats||{}).attack||0} 防:${(t.stats||{}).defense||0} HP:${(t.stats||{}).hp||0} 組織:${(t.stats||{}).org||0}</div>`;
    html += `<div style="display:flex;gap:4px;margin-top:4px">`;
    for (let f = 1; f <= Math.min(c.military_factories||0, 5); f++) {
      html += `<button class="btn btn-primary" onclick="doProduce('${t.id}',${f})" style="font-size:11px;padding:3px 8px">${f}軍工</button>`;
    }
    html += `</div></div>`;
  }
  // Show production queue
  if (c.production_queue && c.production_queue.length > 0) {
    html += '<div style="margin-top:8px;font-size:12px;font-weight:600">生產序列:</div>';
    for (const q of c.production_queue) {
      const pct = Math.min(100, Math.floor((q.progress||0)/(q.cost||100)*100));
      const tpl = tpls.find(t => t.id === q.template_id);
      html += `<div style="font-size:11px;color:#949ba4">${tpl?tpl.name:q.template_id} (${q.factories}軍工) — ${pct}%</div>`;
    }
  }
  el.innerHTML = html;
}

async function doProduce(templateId, factories) {
  const r = await api('/api/game/hoi4/produce', 'POST', { country_id: myCid, template_id: templateId, factories: factories });
  if (r.error) { toast(r.error); return; }
  toast('生產已排程');
  await refresh();
}

function renderDivisionsTab(c, el) {
  const divs = c.divisions || [];
  if (divs.length === 0) { el.innerHTML = '<div style="color:#949ba4">沒有部隊。先生產一些吧。</div>'; return; }
  let html = '';
  for (const d of divs) {
    const tpl = (c.division_templates||[]).find(t => t.id === d.template_id);
    const prov = S.provinces[d.province];
    const strPct = Math.floor((d.strength||0)*100);
    const strColor = strPct > 70 ? '#3ba55d' : strPct > 30 ? '#fee75c' : '#ed4245';
    html += `<div style="background:#1e1f22;border-radius:6px;padding:8px;margin-bottom:4px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:13px">${tpl?tpl.name:d.template_id}</span>
        <span style="font-size:11px;color:#949ba4">@ ${prov?prov.name:d.province}</span>
      </div>
      <div style="font-size:11px;margin-top:2px">
        <span style="color:${strColor}">戰力${strPct}%</span> · 組織${d.org||0}
        <button class="btn btn-ghost" onclick="selProv='${d.province}';selectDiv('${d.id}')" style="font-size:10px;padding:2px 6px;margin-left:6px">移防</button>
      </div>
    </div>`;
  }
  el.innerHTML = html;
}

function renderTemplatesTab(c, el) {
  const tpls = c.division_templates || [];
  const allBn = ['infantry','cavalry','artillery','armor'];
  const allSup = ['support_artillery','engineer','recon'];
  let html = '<div style="font-size:12px;color:#949ba4;margin-bottom:6px">現有編制：</div>';
  for (const t of tpls) {
    html += `<div style="background:#1e1f22;border-radius:6px;padding:8px;margin-bottom:4px">
      <b>${t.name}</b> <span style="font-size:10px;color:#949ba4">營:${(t.battalions||[]).join(',')} 支援:${(t.support||[]).join(',')}</span>
    </div>`;
  }
  // New template form
  html += '<div style="margin-top:10px;border-top:1px solid#3a3c43;padding-top:8px"><div style="font-weight:600;font-size:13px;margin-bottom:6px">新建編制</div>';
  html += '<input id="tpl-name" type="text" placeholder="模板名稱" style="width:100%;margin-bottom:6px"><div style="font-size:11px;color:#949ba4;margin-bottom:4px">營級（勾選）：</div>';
  for (const b of allBn) {
    html += `<label style="font-size:12px;margin-right:8px;cursor:pointer"><input type="checkbox" class="tpl-bn" value="${b}" style="width:auto"> ${b}</label>`;
  }
  html += '<div style="font-size:11px;color:#949ba4;margin:6px 0 4px">支援連（勾選）：</div>';
  for (const s of allSup) {
    html += `<label style="font-size:12px;margin-right:8px;cursor:pointer"><input type="checkbox" class="tpl-sup" value="${s}" style="width:auto"> ${s}</label>`;
  }
  html += '<br><button class="btn btn-primary" onclick="saveTemplate()" style="margin-top:6px">儲存編制</button></div>';
  el.innerHTML = html;
}

async function saveTemplate() {
  const name = document.getElementById('tpl-name').value.trim();
  if (!name) { toast('請輸入模板名稱'); return; }
  const battalions = Array.from(document.querySelectorAll('.tpl-bn:checked')).map(c => c.value);
  const support = Array.from(document.querySelectorAll('.tpl-sup:checked')).map(c => c.value);
  if (battalions.length === 0) { toast('至少選一個營級'); return; }
  const r = await api('/api/game/hoi4/division-template', 'POST', {
    country_id: myCid, template: { name: name, battalions: battalions, support: support }
  });
  if (r.error) { toast(r.error); return; }
  toast('編制已儲存');
  await refresh();
}

// ── Countries list ──
function renderCountries() {
  const el = document.getElementById('countries-list');
  if (!S || !S.countries || Object.keys(S.countries).length === 0) {
    el.innerHTML = '<div style="color:#949ba4;font-size:13px">還沒有國家。加入遊戲即可建立你的國家！</div>';
    return;
  }
  el.innerHTML = Object.entries(S.countries).map(([cid, c]) => {
    const isMe = cid === myCid;
    const divs = c.divisions||[];
    const avgStr = divs.length > 0 ? Math.floor(divs.reduce((s,d) => s+(d.strength||0),0)/divs.length*100) : 0;
    const atWar = c.at_war_with && c.at_war_with.length > 0;
    return `<div style="background:#1e1f22;border-radius:6px;padding:8px;${isMe?'border:1px solid #5865f2':''}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:13px;color:${c.color}">${c.name}</span>
        ${isMe ? '<span class="tag" style="background:#5865f2;color:#fff">你</span>' : ''}
        ${atWar ? '<span class="tag" style="background:#ed4245;color:#fff">⚔️</span>' : ''}
      </div>
      <div style="font-size:11px;color:#949ba4;margin-top:2px">
        領土:${(c.provinces_owned||[]).length} · 師:${divs.length} · 戰力:${avgStr}% · ${atWar ? '戰爭中' : '和平'}
      </div>
    </div>`;
  }).join('');
}

// ── War panel ──
function renderWars() {
  const el = document.getElementById('war-list');
  if (!S || !S.wars || Object.keys(S.wars).length === 0) {
    el.innerHTML = '<div style="color:#949ba4;font-size:13px">目前沒有進行中的戰爭。</div>';
    return;
  }
  el.innerHTML = Object.entries(S.wars).map(([wid, war]) => {
    const atk = S.countries[war.attacker];
    const def = S.countries[war.defender];
    if (!atk || !def) return '';
    const contested = (war.contested_provinces||[]).map(pid => S.provinces[pid] ? S.provinces[pid].name : pid).join('、') || '無交界';
    return `<div style="background:#1e1f22;border-radius:6px;padding:8px;margin-bottom:4px">
      <div>⚔️ <span style="color:${atk.color};font-weight:600">${atk.name}</span> → <span style="color:${def.color};font-weight:600">${def.name}</span></div>
      <div style="font-size:11px;color:#949ba4">爭議省份: ${contested} · 開戰於 Day ${war.start_tick||0}</div>
    </div>`;
  }).join('');
}

// ── Log ──
function renderLog() {
  const el = document.getElementById('log-list');
  if (!S || !S.log) { el.innerHTML = ''; return; }
  el.innerHTML = (S.log||[]).slice(-20).reverse().map(l => `<div>${l}</div>`).join('');
}

// ── Toast ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// ── Start ──
init();
</script>
</body>
</html>
