<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投票系統 Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
  body{font-family:'Segoe UI',system-ui,sans-serif}
  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .spinner{border:3px solid #4e5058;border-top:3px solid #5865f2;border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="bg-[#313338] text-gray-100 min-h-screen">

<!-- Header -->
<nav class="bg-[#2b2d31] border-b border-black/30 px-6 py-3 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <button onclick="navigate('guilds')" class="text-xl font-bold text-[#5865f2]">🗳️ 投票 Dashboard</button>
  </div>
  <div id="nav-user" class="hidden flex items-center gap-3">
    <img id="nav-avatar" class="w-8 h-8 rounded-full" src="">
    <span id="nav-username" class="text-sm text-gray-300"></span>
    <button onclick="logout()" class="text-xs text-gray-400 hover:text-red-400 ml-2">登出</button>
  </div>
</nav>

<!-- Loading -->
<div id="loading" class="flex items-center justify-center min-h-[60vh]">
  <div class="spinner"></div>
</div>

<!-- Login -->
<div id="login-view" class="hidden flex flex-col items-center justify-center min-h-[70vh] gap-6">
  <div class="text-center">
    <h1 class="text-3xl font-bold mb-2">🗳️ 投票系統 Dashboard</h1>
    <p class="text-gray-400">使用 Discord 帳號登入以管理你的投票</p>
  </div>
  <a href="/login" class="bg-[#5865f2] hover:bg-[#4752c4] text-white font-semibold px-8 py-3 rounded-lg transition flex items-center gap-2">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .373-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.056c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    用 Discord 登入
  </a>
</div>

<!-- Main -->
<div id="main-view" class="hidden max-w-5xl mx-auto px-4 py-6">

  <!-- Guilds -->
  <div id="guilds-view" class="hidden fade-in">
    <h2 class="text-xl font-bold mb-4">選擇伺服器</h2>
    <div id="guild-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>

  <!-- Polls -->
  <div id="polls-view" class="hidden fade-in">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <button onclick="navigate('guilds')" class="text-gray-400 hover:text-white text-sm">← 返回</button>
        <h2 id="polls-title" class="text-xl font-bold"></h2>
      </div>
      <button onclick="showCreateModal()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg text-sm font-semibold">+ 建立投票</button>
    </div>
    <div id="poll-list" class="space-y-3"></div>
  </div>

  <!-- Poll Detail -->
  <div id="detail-view" class="hidden fade-in">
    <div class="flex items-center gap-3 mb-4">
      <button onclick="navigate('polls')" class="text-gray-400 hover:text-white text-sm">← 返回列表</button>
    </div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- Create Modal -->
<div id="create-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-[#2b2d31] rounded-xl p-6 w-full max-w-md">
    <h3 class="text-lg font-bold mb-4">建立新投票</h3>
    <label class="block text-sm text-gray-400 mb-1">投票標題</label>
    <input id="create-title" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-4 outline-none focus:ring-2 ring-[#5865f2]" placeholder="輸入投票標題">
    <label class="block text-sm text-gray-400 mb-1">投票模式</label>
    <select id="create-mode" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-4 outline-none">
      <option value="borda">波達計數法（排序投票）</option>
      <option value="simple">一般投票（單選）</option>
    </select>
    <label class="block text-sm text-gray-400 mb-1">選項（至少 2 個）</label>
    <div id="create-options" class="space-y-2 mb-2"></div>
    <button onclick="addOptionInput()" class="text-sm text-[#5865f2] hover:underline mb-4">+ 新增選項</button>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="closeCreateModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
      <button onclick="createPoll()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg font-semibold text-sm">建立</button>
    </div>
  </div>
</div>

<!-- Add Option Modal -->
<div id="option-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-[#2b2d31] rounded-xl p-6 w-full max-w-md">
    <h3 class="text-lg font-bold mb-4">新增選項</h3>
    <input id="option-text" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-4 outline-none focus:ring-2 ring-[#5865f2]" placeholder="選項文字">
    <div class="flex justify-end gap-2">
      <button onclick="closeOptionModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
      <button onclick="addOption()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg font-semibold text-sm">新增</button>
    </div>
  </div>
</div>

<script>
let currentGuild = null;
let currentGuildName = null;
let currentPollId = null;

const statusBadge = {
  drafting: '<span class="text-xs px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-400">草稿</span>',
  active: '<span class="text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-400">進行中</span>',
  ended: '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-500/20 text-gray-400">已結束</span>'
};
const modeName = { borda: '波達計數法', simple: '一般投票' };

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status === 401) { location.reload(); return null; }
  return res.json();
}

async function init() {
  try {
    const me = await api('/api/me');
    if (!me || me.error) { showLogin(); return; }
    document.getElementById('nav-user').classList.remove('hidden');
    document.getElementById('nav-user').classList.add('flex');
    document.getElementById('nav-avatar').src = me.avatar_url;
    document.getElementById('nav-username').textContent = me.username;
    navigate('guilds');
  } catch { showLogin(); }
}

function showLogin() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('login-view').classList.add('flex');
  document.getElementById('main-view').classList.add('hidden');
}

function navigate(view) {
  ['guilds-view', 'polls-view', 'detail-view'].forEach(v => document.getElementById(v).classList.add('hidden'));
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('main-view').classList.remove('hidden');
  if (view === 'guilds') loadGuilds();
  else if (view === 'polls') loadPolls();
  else if (view === 'detail') loadDetail();
}

async function loadGuilds() {
  const guilds = await api('/api/guilds');
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('guilds-view').classList.remove('hidden');
  const html = guilds.map(g => `
    <div onclick="enterGuild('${g.id}','${g.name.replace(/'/g,"\\'")}')" class="bg-[#2b2d31] hover:bg-[#3f4147] rounded-xl p-4 cursor-pointer transition flex items-center gap-3">
      ${g.icon_url ? `<img src="${g.icon_url}" class="w-12 h-12 rounded-full">` : `<div class="w-12 h-12 rounded-full bg-[#5865f2] flex items-center justify-center text-lg font-bold">${g.name[0]}</div>`}
      <div><div class="font-semibold">${g.name}</div><div class="text-xs text-gray-400">${g.id}</div></div>
    </div>`).join('');
  document.getElementById('guild-list').innerHTML = html || '<p class="text-gray-400">沒有可管理的伺服器</p>';
}

function enterGuild(id, name) { currentGuild = id; currentGuildName = name; navigate('polls'); }

async function loadPolls() {
  if (!currentGuild) return navigate('guilds');
  const polls = await api(`/api/guilds/${currentGuild}/polls`);
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('polls-view').classList.remove('hidden');
  document.getElementById('polls-title').textContent = currentGuildName;
  const html = polls.map(p => `
    <div onclick="viewPoll('${p.poll_id}')" class="bg-[#2b2d31] hover:bg-[#3f4147] rounded-xl p-4 cursor-pointer transition">
      <div class="flex items-center justify-between">
        <div class="font-semibold">${p.title}</div>
        ${statusBadge[p.status]}
      </div>
      <div class="text-xs text-gray-400 mt-1">${modeName[p.mode]} · ${p.option_count} 選項 · ${p.vote_count} 人投票 · ID: ${p.poll_id}</div>
    </div>`).join('');
  document.getElementById('poll-list').innerHTML = html || '<p class="text-gray-400">尚無投票，點上方按鈕建立</p>';
}

function viewPoll(id) { currentPollId = id; navigate('detail'); }

async function loadDetail() {
  if (!currentGuild || !currentPollId) return navigate('polls');
  const p = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}`);
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('detail-view').classList.remove('hidden');

  const tally = {};
  if (p.status !== 'drafting') {
    if (p.mode === 'borda') {
      Object.values(p.votes).forEach(rank => {
        rank.forEach((optIdx, pos) => { const txt = p.options[optIdx]?.text || '?'; tally[txt] = (tally[txt]||0) + (p.options.length - 1 - pos); });
      });
    } else {
      Object.values(p.votes).forEach(idx => { const txt = p.options[idx]?.text || '?'; tally[txt] = (tally[txt]||0) + 1; });
    }
  }
  const ranked = Object.entries(tally).sort((a,b) => b[1]-a[1]);
  const medals = ['🥇','🥈','🥉'];
  const unit = p.mode === 'borda' ? '分' : '票';

  let actions = '';
  if (p.status === 'drafting') {
    actions = `
      <button onclick="startPoll()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-semibold">啟動投票</button>
      <button onclick="showOptionModal()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg text-sm font-semibold">新增選項</button>`;
  } else if (p.status === 'active') {
    actions = `<button onclick="endPoll()" class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded-lg text-sm font-semibold">結束投票</button>`;
  }
  actions += ` <button onclick="deletePoll()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-semibold">刪除投票</button>`;

  let voteDetail = '';
  const voteEntries = Object.entries(p.votes);
  if (voteEntries.length > 0) {
    voteDetail = '<div class="mt-4"><h4 class="text-sm font-semibold text-gray-400 mb-2">投票明細</h4><div class="space-y-1 text-sm">';
    voteEntries.forEach(([uid, data]) => {
      if (p.mode === 'borda') {
        const ranking = data.map((idx, pos) => `${pos+1}. ${p.options[idx]?.text||'?'}`).join('  ');
        voteDetail += `<div class="bg-[#1e1f22] rounded px-3 py-1.5"><span class="text-gray-300">用戶 ${uid}</span><br><span class="text-gray-400 text-xs">${ranking}</span></div>`;
      } else {
        voteDetail += `<div class="bg-[#1e1f22] rounded px-3 py-1.5"><span class="text-gray-300">用戶 ${uid}</span>: <span class="text-[#5865f2]">${p.options[data]?.text||'?'}</span></div>`;
      }
    });
    voteDetail += '</div></div>';
  } else {
    voteDetail = '<p class="text-gray-400 text-sm mt-4">尚無投票紀錄</p>';
  }

  document.getElementById('detail-content').innerHTML = `
    <div class="bg-[#2b2d31] rounded-xl p-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-xl font-bold">${p.title}</h3>
          <div class="text-sm text-gray-400 mt-1">${modeName[p.mode]} · ${statusBadge[p.status]} · ID: ${p.poll_id}</div>
        </div>
      </div>
      <div class="flex gap-2 mb-4">${actions}</div>
      <div>
        <h4 class="text-sm font-semibold text-gray-400 mb-2">選項與結果</h4>
        ${ranked.length ? ranked.map(([txt, score], i) => `<div class="flex items-center justify-between bg-[#1e1f22] rounded-lg px-3 py-2 mb-1"><span>${medals[i]||\`#\${i+1}\`} ${txt}</span><span class="font-bold text-[#5865f2]">${score} ${unit}</span></div>`).join('') : p.options.map((o,i)=>`<div class="bg-[#1e1f22] rounded-lg px-3 py-2 mb-1">${i+1}. ${o.text}</div>`).join('')}
      </div>
      ${voteDetail}
    </div>`;
}

// --- Actions ---
async function startPoll() {
  if (!confirm('確定啟動投票？')) return;
  await api(`/api/guilds/${currentGuild}/polls/${currentPollId}/start`, 'POST');
  loadDetail();
}
async function endPoll() {
  if (!confirm('確定結束投票？')) return;
  await api(`/api/guilds/${currentGuild}/polls/${currentPollId}/end`, 'POST');
  loadDetail();
}
async function deletePoll() {
  if (!confirm('確定刪除此投票？此操作無法復原。')) return;
  await api(`/api/guilds/${currentGuild}/polls/${currentPollId}`, 'DELETE');
  navigate('polls');
}

// --- Create Modal ---
function showCreateModal() {
  document.getElementById('create-title').value = '';
  document.getElementById('create-mode').value = 'borda';
  document.getElementById('create-options').innerHTML = '';
  addOptionInput(); addOptionInput();
  document.getElementById('create-modal').classList.remove('hidden');
  document.getElementById('create-modal').classList.add('flex');
}
function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }
function addOptionInput() {
  const div = document.createElement('div');
  div.className = 'flex gap-2';
  div.innerHTML = `<input class="flex-1 bg-[#1e1f22] text-white rounded-lg px-3 py-2 outline-none focus:ring-2 ring-[#5865f2]" placeholder="選項文字"><button onclick="this.parentElement.remove()" class="text-red-400 px-2">✕</button>`;
  document.getElementById('create-options').appendChild(div);
}
async function createPoll() {
  const title = document.getElementById('create-title').value.trim();
  const mode = document.getElementById('create-mode').value;
  const options = [...document.querySelectorAll('#create-options input')].map(i => i.value.trim()).filter(Boolean);
  if (!title) return alert('請輸入標題');
  if (options.length < 2) return alert('至少需要 2 個選項');
  await api(`/api/guilds/${currentGuild}/polls`, 'POST', { title, mode, options });
  closeCreateModal(); loadPolls();
}

// --- Add Option Modal ---
function showOptionModal() { document.getElementById('option-text').value=''; document.getElementById('option-modal').classList.remove('hidden'); document.getElementById('option-modal').classList.add('flex'); }
function closeOptionModal() { document.getElementById('option-modal').classList.add('hidden'); }
async function addOption() {
  const text = document.getElementById('option-text').value.trim();
  if (!text) return alert('請輸入選項文字');
  await api(`/api/guilds/${currentGuild}/polls/${currentPollId}/options`, 'POST', { text });
  closeOptionModal(); loadDetail();
}

async function logout() { await fetch('/logout', { method: 'POST' }); location.reload(); }

init();
</script>
</body>
</html>
