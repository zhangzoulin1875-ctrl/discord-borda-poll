<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICEA official</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
  body{font-family:'Segoe UI',system-ui,sans-serif}
  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .spinner{border:3px solid #4e5058;border-top:3px solid #5865f2;border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ba55d;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body class="bg-[#313338] text-gray-100 min-h-screen">

<!-- Header -->
<nav class="bg-[#2b2d31] border-b border-black/30 px-6 py-3 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <button onclick="navigate('guilds')" class="text-xl font-bold text-[#5865f2]">ICEA official</button>
  </div>
  <div id="nav-user" class="hidden flex items-center gap-3">
    <img id="nav-avatar" class="w-8 h-8 rounded-full" src="">
    <span id="nav-username" class="text-sm text-gray-300"></span>
    <button onclick="logout()" class="text-xs text-gray-400 hover:text-red-400 ml-2">登出</button>
  </div>
</nav>

<!-- Loading -->
<div id="loading" class="flex flex-col items-center justify-center min-h-[60vh] gap-4">
  <div class="spinner"></div>
  <p id="loading-msg" class="text-sm text-gray-400">載入中...</p>
</div>

<!-- Login -->
<div id="login-view" class="hidden flex-col items-center justify-center min-h-[70vh] gap-6">
  <div class="text-center">
    <h1 class="text-3xl font-bold mb-2">ICEA official</h1>
    <p class="text-gray-400">使用 Discord 帳號登入以管理投票</p>
  </div>
  <a href="/login" class="bg-[#5865f2] hover:bg-[#4752c4] text-white font-semibold px-8 py-3 rounded-lg transition flex items-center gap-2">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .373-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.056c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    用 Discord 登入
  </a>
</div>

<!-- Error -->
<div id="error-view" class="hidden flex-col items-center justify-center min-h-[60vh] gap-4">
  <div class="text-red-400 text-4xl">⚠️</div>
  <p id="error-msg" class="text-gray-300"></p>
  <button onclick="init()" class="text-[#5865f2] hover:underline text-sm">重試</button>
</div>

<!-- Main -->
<div id="main-view" class="hidden max-w-5xl mx-auto px-4 py-6">

  <!-- Guilds -->
  <div id="guilds-view" class="hidden fade-in">
    <h2 class="text-xl font-bold mb-4">選擇伺服器</h2>
    <div id="guild-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>

  <!-- Polls -->
  <div id="polls-view" class="hidden fade-in">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <button onclick="navigate('guilds')" class="text-gray-400 hover:text-white text-sm">← 返回</button>
        <h2 id="polls-title" class="text-xl font-bold"></h2>
      </div>
      <button onclick="showCreateModal()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg text-sm font-semibold">+ 建立投票</button>
    </div>
    <div id="poll-list" class="space-y-3"></div>
  </div>

  <!-- Poll Detail -->
  <div id="detail-view" class="hidden fade-in">
    <div class="flex items-center gap-3 mb-4">
      <button onclick="navigate('polls')" class="text-gray-400 hover:text-white text-sm">← 返回列表</button>
    </div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- Create Modal -->
<div id="create-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-[#2b2d31] rounded-xl p-6 w-full max-w-md max-h-[85vh] overflow-y-auto">
    <h3 class="text-lg font-bold mb-4">建立新投票</h3>
    <label class="block text-sm text-gray-400 mb-1">投票標題</label>
    <input id="create-title" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-3 outline-none focus:ring-2 ring-[#5865f2]" placeholder="輸入投票標題">
    <label class="block text-sm text-gray-400 mb-1">投票說明（選填）</label>
    <textarea id="create-description" rows="3" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-3 outline-none focus:ring-2 ring-[#5865f2] resize-none" placeholder="說明此投票的目的、背景資訊等"></textarea>
    <label class="block text-sm text-gray-400 mb-1">投票模式</label>
    <select id="create-mode" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-3 outline-none">
      <option value="borda">波達計數法（排序投票）</option>
      <option value="simple">一般投票（單選）</option>
    </select>
    <label class="block text-sm text-gray-400 mb-1">限時（小時，0 = 不限時）</label>
    <input id="create-duration" type="number" min="0" value="0" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-3 outline-none focus:ring-2 ring-[#5865f2]" placeholder="例如 24 表示 24 小時後自動結束">
    <label class="block text-sm text-gray-400 mb-1">選項（至少 2 個）</label>
    <div id="create-options" class="space-y-2 mb-2"></div>
    <button onclick="addOptionInput()" class="text-sm text-[#5865f2] hover:underline mb-4">+ 新增選項</button>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="closeCreateModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
      <button onclick="createPoll()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg font-semibold text-sm">建立</button>
    </div>
  </div>
</div>

<!-- Add Option Modal -->
<div id="option-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-[#2b2d31] rounded-xl p-6 w-full max-w-md">
    <h3 class="text-lg font-bold mb-4">新增選項</h3>
    <input id="option-text" class="w-full bg-[#1e1f22] text-white rounded-lg px-3 py-2 mb-4 outline-none focus:ring-2 ring-[#5865f2]" placeholder="選項文字">
    <div class="flex justify-end gap-2">
      <button onclick="closeOptionModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
      <button onclick="addOption()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg font-semibold text-sm">新增</button>
    </div>
  </div>
</div>

<script>
let currentGuild = null;
let currentGuildName = null;
let currentPollId = null;
let refreshTimer = null;

const statusBadge = {
  drafting: '<span class="text-xs px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-400">草稿</span>',
  active: '<span class="text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-400">進行中</span>',
  ended: '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-500/20 text-gray-400">已結束</span>'
};
const modeName = { borda: '波達計數法', simple: '一般投票' };

function showOnly(id) {
  ['loading','login-view','main-view','error-view'].forEach(v => {
    const el = document.getElementById(v);
    if (v === id) {
      el.classList.remove('hidden');
      if (v === 'login-view' || v === 'error-view') el.classList.add('flex');
    } else {
      el.classList.add('hidden');
      if (v === 'login-view' || v === 'error-view') el.classList.remove('flex');
    }
  });
}

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: {}, credentials: 'include' };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  try {
    const res = await fetch(path, opts);
    if (res.status === 401) return { error: 'unauthorized', status: 401 };
    if (res.status === 403) return { error: 'forbidden', status: 403 };
    if (!res.ok) return { error: `HTTP ${res.status}`, status: res.status };
    return res.json();
  } catch (e) {
    return { error: e.message };
  }
}

async function init() {
  showOnly('loading');
  document.getElementById('loading-msg').textContent = '驗證登入狀態...';
  try {
    const me = await api('/api/me');
    if (me.error || me.status === 401) { showOnly('login-view'); return; }
    document.getElementById('nav-user').classList.remove('hidden');
    document.getElementById('nav-user').classList.add('flex');
    document.getElementById('nav-avatar').src = me.avatar_url;
    document.getElementById('nav-username').textContent = me.username;
    showOnly('main-view');
    navigate('guilds');
  } catch(e) {
    showError('無法連線到伺服器：' + e.message);
  }
}

function showError(msg) { showOnly('error-view'); document.getElementById('error-msg').textContent = msg; }
function showLoading(msg) { document.getElementById('loading-msg').textContent = msg || '載入中...'; showOnly('loading'); }

function navigate(view) {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  ['guilds-view','polls-view','detail-view'].forEach(v => document.getElementById(v).classList.add('hidden'));
  showOnly('main-view');
  if (view === 'guilds') loadGuilds();
  else if (view === 'polls') loadPolls();
  else if (view === 'detail') loadDetail();
}

async function loadGuilds() {
  showLoading('載入伺服器列表...');
  const guilds = await api('/api/guilds');
  if (guilds.error) { showError('載入伺服器失敗：' + guilds.error); return; }
  showOnly('main-view');
  document.getElementById('guilds-view').classList.remove('hidden');
  const html = guilds.map(g => `
    <div onclick="enterGuild('${g.id}','${escHtml(g.name)}')" class="bg-[#2b2d31] hover:bg-[#3f4147] rounded-xl p-4 cursor-pointer transition flex items-center gap-3">
      ${g.icon_url ? `<img src="${g.icon_url}" class="w-12 h-12 rounded-full">` : `<div class="w-12 h-12 rounded-full bg-[#5865f2] flex items-center justify-center text-lg font-bold">${escHtml(g.name[0])}</div>`}
      <div><div class="font-semibold">${escHtml(g.name)}</div><div class="text-xs text-gray-400">${g.id}</div></div>
    </div>`).join('');
  document.getElementById('guild-list').innerHTML = html || '<p class="text-gray-400">沒有可管理的伺服器（你需要在伺服器中有管理員權限）</p>';
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function enterGuild(id, name) { currentGuild = id; currentGuildName = name; navigate('polls'); }

async function loadPolls() {
  if (!currentGuild) return navigate('guilds');
  showLoading('載入投票列表...');
  const polls = await api(`/api/guilds/${currentGuild}/polls`);
  if (polls.error) { showError('載入投票失敗：' + polls.error); return; }
  showOnly('main-view');
  document.getElementById('polls-view').classList.remove('hidden');
  document.getElementById('polls-title').textContent = currentGuildName;
  const html = polls.map(p => {
    let extra = '';
    if (p.ends_at) {
      const endTime = new Date(p.ends_at);
      const now = new Date();
      if (p.status === 'active' && endTime > now) {
        const hrs = Math.round((endTime - now) / 3600000);
        extra += ` · ⏰ ${hrs}h 後結束`;
      } else if (p.status === 'active') {
        extra += ' · ⏰ 結束中';
      }
    }
    if (p.description) extra += ` · 📝 ${escHtml(p.description.slice(0,30))}${p.description.length>30?'...':''}`;
    return `
    <div onclick="viewPoll('${escHtml(p.poll_id)}')" class="bg-[#2b2d31] hover:bg-[#3f4147] rounded-xl p-4 cursor-pointer transition">
      <div class="flex items-center justify-between">
        <div class="font-semibold">${escHtml(p.title)}</div>
        ${statusBadge[p.status] || ''}
      </div>
      <div class="text-xs text-gray-400 mt-1">${modeName[p.mode]||p.mode} · ${p.option_count} 選項 · ${p.vote_count} 人投票${extra}</div>
    </div>`;
  }).join('');
  document.getElementById('poll-list').innerHTML = html || '<p class="text-gray-400 py-4">尚無投票，點右上角按鈕建立</p>';
}

function viewPoll(id) { currentPollId = id; navigate('detail'); }

async function loadDetail() {
  if (!currentGuild || !currentPollId) return navigate('polls');
  showLoading('載入投票詳情...');
  const p = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}`);
  if (p.error) { showError('載入投票失敗：' + p.error); return; }
  showOnly('main-view');
  document.getElementById('detail-view').classList.remove('hidden');
  renderDetail(p);

  // Auto-refresh for active polls every 10 seconds
  if (p.status === 'active') {
    refreshTimer = setInterval(async () => {
      const fresh = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}`);
      if (!fresh.error && fresh.status === 'active') {
        renderDetail(fresh);
      } else {
        // Poll ended or error - stop refreshing and reload final state
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        const final = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}`);
        if (!final.error) renderDetail(final);
      }
    }, 10000);
  }
}

function renderDetail(p) {
  const tally = {};
  if (p.status !== 'drafting') {
    if (p.mode === 'borda') {
      Object.values(p.votes || {}).forEach(rank => {
        if (Array.isArray(rank)) {
          rank.forEach((optIdx, pos) => { const txt = p.options[optIdx]?.text || '?'; tally[txt] = (tally[txt]||0) + (p.options.length - 1 - pos); });
        }
      });
    } else {
      Object.values(p.votes || {}).forEach(idx => { const txt = p.options[idx]?.text || '?'; tally[txt] = (tally[txt]||0) + 1; });
    }
  }
  const ranked = Object.entries(tally).sort((a,b) => b[1]-a[1]);
  const medals = ['🥇','🥈','🥉'];
  const unit = p.mode === 'borda' ? '分' : '票';

  let actions = '';
  if (p.status === 'drafting') {
    actions = `
      <button onclick="startPoll()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-semibold">▶ 啟動投票</button>
      <button onclick="showOptionModal()" class="bg-[#5865f2] hover:bg-[#4752c4] px-4 py-2 rounded-lg text-sm font-semibold">+ 新增選項</button>`;
  } else if (p.status === 'active') {
    actions = `<button onclick="endPoll()" class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded-lg text-sm font-semibold">⏹ 結束投票</button>`;
  }
  actions += ` <button onclick="deletePoll()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-semibold">🗑 刪除投票</button>`;

  let voteDetail = '';
  const voteEntries = Object.entries(p.votes || {});
  if (voteEntries.length > 0) {
    voteDetail = '<div class="mt-4"><h4 class="text-sm font-semibold text-gray-400 mb-2">投票明細</h4><div class="space-y-1 text-sm">';
    voteEntries.forEach(([uid, data]) => {
      if (p.mode === 'borda' && Array.isArray(data)) {
        const ranking = data.map((idx, pos) => `${pos+1}. ${escHtml(p.options[idx]?.text||'?')}`).join('  ');
        voteDetail += `<div class="bg-[#1e1f22] rounded px-3 py-1.5"><span class="text-gray-300">用戶 ${escHtml(uid)}</span><br><span class="text-gray-400 text-xs">${ranking}</span></div>`;
      } else {
        voteDetail += `<div class="bg-[#1e1f22] rounded px-3 py-1.5"><span class="text-gray-300">用戶 ${escHtml(uid)}</span>: <span class="text-[#5865f2]">${escHtml(p.options[data]?.text||'?')}</span></div>`;
      }
    });
    voteDetail += '</div></div>';
  } else {
    voteDetail = '<p class="text-gray-400 text-sm mt-4">📭 尚無投票紀錄</p>';
  }

  // Description section
  let descHtml = '';
  if (p.description) {
    descHtml = `<div class="bg-[#1e1f22] rounded-lg px-4 py-3 mb-4 text-sm text-gray-300">📝 ${escHtml(p.description)}</div>`;
  }

  // End time display
  let endsAtHtml = '';
  if (p.ends_at) {
    const endTime = new Date(p.ends_at);
    const now = new Date();
    if (p.status === 'active') {
      const remaining = endTime - now;
      if (remaining > 0) {
        const hrs = Math.floor(remaining / 3600000);
        const mins = Math.floor((remaining % 3600000) / 60000);
        endsAtHtml = `<div class="text-xs text-yellow-400 mb-2">⏰ 剩餘 ${hrs}小時 ${mins}分鐘（${endTime.toLocaleString('zh-TW')} 自動結束）</div>`;
      } else {
        endsAtHtml = `<div class="text-xs text-red-400 mb-2">⏰ 已過截止時間（結束中...）</div>`;
      }
    } else {
      endsAtHtml = `<div class="text-xs text-gray-400 mb-2">⏰ 截止：${endTime.toLocaleString('zh-TW')}</div>`;
    }
  }

  // Live indicator for active polls
  let liveBadge = '';
  if (p.status === 'active') {
    liveBadge = ' <span class="text-xs text-green-400"><span class="live-dot"></span> 即時更新中</span>';
  }

  const optionHtml = ranked.length
    ? ranked.map(([txt, score], i) => `<div class="flex items-center justify-between bg-[#1e1f22] rounded-lg px-3 py-2 mb-1"><span>${medals[i]||`#${i+1}`} ${escHtml(txt)}</span><span class="font-bold text-[#5865f2]">${score} ${unit}</span></div>`).join('')
    : p.options.map((o,i)=>`<div class="bg-[#1e1f22] rounded-lg px-3 py-2 mb-1">${i+1}. ${escHtml(o.text)}</div>`).join('');

  document.getElementById('detail-content').innerHTML = `
    <div class="bg-[#2b2d31] rounded-xl p-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-xl font-bold">${escHtml(p.title)}${liveBadge}</h3>
          <div class="text-sm text-gray-400 mt-1">${modeName[p.mode]||p.mode} · ${statusBadge[p.status]||p.status} · ID: ${escHtml(p.poll_id)}</div>
        </div>
      </div>
      ${descHtml}
      ${endsAtHtml}
      <div class="flex flex-wrap gap-2 mb-4">${actions}</div>
      <div>
        <h4 class="text-sm font-semibold text-gray-400 mb-2">選項與結果</h4>
        ${optionHtml}
      </div>
      ${voteDetail}
    </div>`;
}

async function startPoll() {
  if (!confirm('確定啟動投票？')) return;
  const r = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}/start`, 'POST');
  if (r.error) { alert('啟動失敗：' + r.error); return; }
  loadDetail();
}
async function endPoll() {
  if (!confirm('確定結束投票？')) return;
  const r = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}/end`, 'POST');
  if (r.error) { alert('結束失敗：' + r.error); return; }
  loadDetail();
}
async function deletePoll() {
  if (!confirm('確定刪除此投票？此操作無法復原。')) return;
  const r = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}`, 'DELETE');
  if (r.error) { alert('刪除失敗：' + r.error); return; }
  navigate('polls');
}

function showCreateModal() {
  document.getElementById('create-title').value = '';
  document.getElementById('create-description').value = '';
  document.getElementById('create-mode').value = 'borda';
  document.getElementById('create-duration').value = '0';
  document.getElementById('create-options').innerHTML = '';
  addOptionInput(); addOptionInput();
  document.getElementById('create-modal').classList.remove('hidden');
}
function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }
function addOptionInput() {
  const div = document.createElement('div');
  div.className = 'flex gap-2';
  div.innerHTML = `<input class="flex-1 bg-[#1e1f22] text-white rounded-lg px-3 py-2 outline-none focus:ring-2 ring-[#5865f2]" placeholder="選項文字"><button onclick="this.parentElement.remove()" class="text-red-400 px-2">✕</button>`;
  document.getElementById('create-options').appendChild(div);
}
async function createPoll() {
  const title = document.getElementById('create-title').value.trim();
  const description = document.getElementById('create-description').value.trim();
  const mode = document.getElementById('create-mode').value;
  const duration = parseInt(document.getElementById('create-duration').value) || 0;
  const options = [...document.querySelectorAll('#create-options input')].map(i => i.value.trim()).filter(Boolean);
  if (!title) return alert('請輸入標題');
  if (options.length < 2) return alert('至少需要 2 個選項');
  const r = await api(`/api/guilds/${currentGuild}/polls`, 'POST', { title, mode, options, description, duration_hours: duration });
  if (r.error) { alert('建立失敗：' + r.error); return; }
  closeCreateModal(); loadPolls();
}

function showOptionModal() { document.getElementById('option-text').value = ''; document.getElementById('option-modal').classList.remove('hidden'); }
function closeOptionModal() { document.getElementById('option-modal').classList.add('hidden'); }
async function addOption() {
  const text = document.getElementById('option-text').value.trim();
  if (!text) return alert('請輸入選項文字');
  const r = await api(`/api/guilds/${currentGuild}/polls/${currentPollId}/options`, 'POST', { text });
  if (r.error) { alert('新增失敗：' + r.error); return; }
  closeOptionModal(); loadDetail();
}

async function logout() { await fetch('/logout', { method: 'POST', credentials: 'include' }); location.reload(); }
init();
</script>
</body>
</html>
