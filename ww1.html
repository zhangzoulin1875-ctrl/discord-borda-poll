<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WW1 首相模擬器</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --muted: #7d8590;
  --primary: #da3633; --primary-hover: #f85149;
  --gold: #d29922; --green: #3fb950; --blue: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { color: var(--primary); margin-bottom: 8px; font-size: 1.8em; }
h2 { color: var(--gold); margin: 20px 0 10px; font-size: 1.3em; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
.subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.9em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card h3 { color: var(--blue); margin-bottom: 10px; font-size: 1.1em; }
.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.stat-row:last-child { border: none; }
.stat-label { color: var(--muted); font-size: 0.9em; }
.stat-bar-bg { width: 120px; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.bar-green { background: var(--green); }
.bar-yellow { background: var(--gold); }
.bar-red { background: var(--primary); }
.btn { display: inline-block; padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
.btn:hover { border-color: var(--primary); background: #21262d; }
.btn-primary { background: var(--primary); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 0.9em; }
textarea { resize: vertical; min-height: 80px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.85em; }
.report-box { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 16px; white-space: pre-wrap; font-size: 0.95em; line-height: 1.8; max-height: 500px; overflow-y: auto; }
.veto-box { background: rgba(218,54,51,0.1); border: 1px solid var(--primary); border-radius: 6px; padding: 10px; margin: 8px 0; }
.emperor-msg { margin: 8px 0; padding: 10px; border-radius: 6px; }
.emperor-msg.player { background: rgba(88,166,255,0.1); border-left: 3px solid var(--blue); }
.emperor-msg.ruler { background: rgba(210,153,34,0.1); border-left: 3px solid var(--gold); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; margin-right: 4px; }
.tag-monarchy { background: rgba(210,153,34,0.2); color: var(--gold); }
.tag-republic { background: rgba(88,166,255,0.2); color: var(--blue); }
.tag-dead { background: rgba(218,54,51,0.2); color: var(--primary); }
.tag-alive { background: rgba(63,185,80,0.2); color: var(--green); }
.player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.player-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.hidden { display: none; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
.login-box { text-align: center; padding: 30px; }
.login-box input { max-width: 300px; margin: 10px auto; }
.error-msg { color: var(--primary); margin: 10px 0; }
.success-msg { color: var(--green); margin: 10px 0; }
</style>
</head>
<body>
<div class="container">
<h1>⚔️ WW1 首相模擬器</h1>
<p class="subtitle">第一次世界大戰 · 多人回合制政治軍事模擬</p>

<!-- 登入 -->
<div id="login-section" class="card">
  <h3>🔐 身份驗證</h3>
  <p style="color:var(--muted);font-size:0.85em;margin-bottom:10px">輸入你的 Discord ID 以存取遊戲面板。</p>
  <input type="text" id="auth-id" placeholder="Discord User ID (數字)" />
  <button class="btn btn-primary" onclick="login()" style="margin-top:10px">進入</button>
</div>

<!-- 遊戲面板 -->
<div id="game-section" class="hidden">
  <!-- 狀態列 -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <span id="game-phase" style="font-size:1.1em;font-weight:bold"></span>
        <span id="game-turn" style="color:var(--muted);margin-left:10px"></span>
      </div>
      <button class="btn" onclick="refreshState()">🔄 重新整理</button>
    </div>
  </div>

  <!-- 大廳 -->
  <div id="lobby-section" class="hidden">
    <h2>🏛️ 遊戲大廳</h2>
    <div class="card">
      <h3>選擇國家加入</h3>
      <div class="form-group">
        <label>國家</label>
        <select id="country-select"></select>
      </div>
      <button class="btn btn-primary" onclick="joinGame()">加入遊戲</button>
    </div>
  </div>

  <!-- 前線報告 -->
  <div id="report-section" class="hidden">
    <h2>📡 前線報告</h2>
    <div class="card">
      <div id="report-content" class="report-box">
        <div class="loading">載入中...</div>
      </div>
    </div>
  </div>

  <!-- 滿意度 -->
  <div id="satisfaction-section" class="hidden">
    <h2>📊 滿意度概況</h2>
    <div class="card" id="satisfaction-card"></div>
  </div>

  <!-- 政策決策 -->
  <div id="policy-section" class="hidden">
    <h2>📋 政策決策</h2>
    <div class="card">
      <div class="form-group">
        <label>決策類型</label>
        <select id="policy-type">
          <option value="軍事">軍事 — 軍隊調動、攻勢、防禦</option>
          <option value="經濟">經濟 — 生產、配給、工業動員</option>
          <option value="外交">外交 — 聯盟、貿易、和平談判</option>
          <option value="內政">內政 — 宣傳、徵兵、改革</option>
        </select>
      </div>
      <div class="form-group">
        <label>決策內容</label>
        <textarea id="policy-action" placeholder="描述你的政策決策..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="submitPolicy()">提交決策</button>
    </div>
    <div class="card">
      <h3>本回合已提交的決策</h3>
      <div id="pending-decisions"><p style="color:var(--muted)">尚未提交任何決策</p></div>
    </div>
  </div>

  <!-- 皇帝對話 -->
  <div id="emperor-section" class="hidden">
    <h2>👑 與統治者對話</h2>
    <div class="card">
      <p style="color:var(--muted);font-size:0.85em">每回合可對話 3 次。統治者態度取決於滿意度。</p>
      <div class="form-group">
        <label>對統治者說...</label>
        <textarea id="emperor-message" placeholder="向皇帝/國王表達你的想法..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="talkToEmperor()">發送</button>
      <span id="emperor-remaining" style="color:var(--muted);margin-left:10px"></span>
    </div>
    <div class="card">
      <h3>對話紀錄</h3>
      <div id="emperor-dialogue"><p style="color:var(--muted)">尚無對話</p></div>
    </div>
  </div>

  <!-- 否決紀錄 -->
  <div id="veto-section" class="hidden">
    <h2>🚫 否決紀錄</h2>
    <div class="card" id="veto-list"><p style="color:var(--muted)">尚無否決紀錄</p></div>
  </div>

  <!-- 參戰國 -->
  <div id="players-section" class="hidden">
    <h2>🌍 參戰國</h2>
    <div class="player-grid" id="player-grid"></div>
  </div>

  <!-- 管理員面板 -->
  <div id="admin-section" class="hidden">
    <h2>⚙️ 管理員面板</h2>
    <div class="card">
      <h3>回合控制</h3>
      <button class="btn btn-primary" onclick="advanceTurn()">⏩ 推進回合</button>
      <span id="advance-status" style="margin-left:10px"></span>
    </div>
    <div class="card">
      <h3>AI API 三層降級鏈設定</h3>
      <div id="api-settings"></div>
      <button class="btn btn-primary" onclick="saveApiSettings()" style="margin-top:10px">儲存設定</button>
    </div>
  </div>
</div>
</div>

<script>
let AUTH_ID = localStorage.getItem('ww1_auth_id') || '';
let gameState = null;
let myPlayer = null;
let isAdmin = false;

const COUNTRIES = ["德意志帝國","奧匈帝國","奧斯曼帝國","俄羅斯帝國","法蘭西共和國","大英帝國","義大利王國","美利堅合眾國"];

function init() {
  if (AUTH_ID) {
    document.getElementById('auth-id').value = AUTH_ID;
    login();
  }
}

function login() {
  AUTH_ID = document.getElementById('auth-id').value.trim();
  if (!AUTH_ID) return;
  localStorage.setItem('ww1_auth_id', AUTH_ID);
  document.getElementById('login-section').classList.add('hidden');
  document.getElementById('game-section').classList.remove('hidden');
  refreshState();
}

async function api(path, method='GET', body=null) {
  const opts = { method, headers: { 'X-Auth': AUTH_ID, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({error: res.statusText}));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function refreshState() {
  try {
    const data = await api(`/api/ww1/state?pid=${AUTH_ID}`);
    gameState = data;
    myPlayer = data.players[AUTH_ID] || null;
    isAdmin = (AUTH_ID === '1482256878334640209');
    render();
  } catch(e) {
    console.error(e);
  }
}

function render() {
  if (!gameState) return;
  const phaseEl = document.getElementById('game-phase');
  phaseEl.textContent = {none:'無遊戲', lobby:'大廳', active:'進行中', ended:'已結束'}[gameState.phase] || gameState.phase;
  document.getElementById('game-turn').textContent = gameState.phase === 'active' ? `第 ${gameState.turn} 回合` : '';

  const lobby = document.getElementById('lobby-section');
  const report = document.getElementById('report-section');
  const sat = document.getElementById('satisfaction-section');
  const policy = document.getElementById('policy-section');
  const emperor = document.getElementById('emperor-section');
  const veto = document.getElementById('veto-section');
  const players = document.getElementById('players-section');
  const admin = document.getElementById('admin-section');

  [lobby, report, sat, policy, emperor, veto, players, admin].forEach(e => e.classList.add('hidden'));

  if (gameState.phase === 'lobby') {
    lobby.classList.remove('hidden');
    renderCountrySelect();
  }

  if (myPlayer) {
    if (gameState.phase === 'active' && myPlayer.alive !== false) {
      report.classList.remove('hidden');
      sat.classList.remove('hidden');
      policy.classList.remove('hidden');
      if (myPlayer.government === 'monarchy') emperor.classList.remove('hidden');
      veto.classList.remove('hidden');
      renderReport();
      renderSatisfaction();
      renderPendingDecisions();
      renderEmperorDialogue();
      renderVetoes();
    }
  }

  players.classList.remove('hidden');
  renderPlayers();

  if (isAdmin) {
    admin.classList.remove('hidden');
    renderAdmin();
  }
}

function renderCountrySelect() {
  const sel = document.getElementById('country-select');
  const taken = new Set(Object.values(gameState.players).map(p => p.country));
  sel.innerHTML = COUNTRIES.filter(c => !taken.has(c)).map(c => {
    const isMon = !['法蘭西共和國','美利堅合眾國'].includes(c);
    return `<option value="${c}">${c} ${isMon?'👑':'🏛️'}</option>`;
  }).join('');
  if (!sel.innerHTML) sel.innerHTML = '<option value="">所有國家已被選擇</option>';
}

function renderReport() {
  const el = document.getElementById('report-content');
  if (!myPlayer || !myPlayer.reports || !myPlayer.reports.length) {
    el.innerHTML = '<p style="color:var(--muted)">尚無前線報告</p>';
    return;
  }
  const latest = myPlayer.reports[myPlayer.reports.length - 1];
  el.innerHTML = `<div style="color:var(--muted);font-size:0.8em;margin-bottom:8px">第 ${latest.turn} 回合 · ${latest.timestamp}</div>${latest.text}`;
}

function renderSatisfaction() {
  const el = document.getElementById('satisfaction-card');
  if (!myPlayer || !myPlayer.satisfaction) {
    el.innerHTML = '<p style="color:var(--muted)">無法查看</p>';
    return;
  }
  const labels = {emperor:'👑 皇帝', military:'⚔️ 軍方', nobility:'🎩 貴族', civilian:'👥 平民', church:'✝️ 教會'};
  let html = '';
  for (const [k, v] of Object.entries(myPlayer.satisfaction)) {
    const label = labels[k] || k;
    const pct = Math.max(0, Math.min(100, v));
    const cls = pct > 60 ? 'bar-green' : pct > 30 ? 'bar-yellow' : 'bar-red';
    html += `<div class="stat-row"><span class="stat-label">${label}</span><div style="display:flex;align-items:center;gap:8px"><div class="stat-bar-bg"><div class="stat-bar-fill ${cls}" style="width:${pct}%"></div></div><span style="font-size:0.85em;width:35px;text-align:right">${pct}</span></div></div>`;
  }
  // Stats (hidden, only show if dead)
  if (myPlayer.alive === false && myPlayer.defeat_reason) {
    html += `<div style="margin-top:10px;padding:8px;background:rgba(218,54,51,0.1);border-radius:6px;color:var(--primary)">☠️ ${myPlayer.defeat_reason}</div>`;
  }
  el.innerHTML = html;
}

function renderPendingDecisions() {
  const el = document.getElementById('pending-decisions');
  if (!myPlayer || !myPlayer.pending_decisions || !myPlayer.pending_decisions.length) {
    el.innerHTML = '<p style="color:var(--muted)">尚未提交任何決策</p>';
    return;
  }
  el.innerHTML = myPlayer.pending_decisions.map(d => `<div class="stat-row"><span><span class="tag tag-monarchy">${d.type}</span> ${d.action}</span></div>`).join('');
}

function renderEmperorDialogue() {
  const el = document.getElementById('emperor-dialogue');
  if (!myPlayer || !myPlayer.emperor_dialogues || !myPlayer.emperor_dialogues.length) {
    el.innerHTML = '<p style="color:var(--muted)">尚無對話</p>';
  } else {
    el.innerHTML = myPlayer.emperor_dialogues.slice(-10).map(d => 
      `<div class="emperor-msg player"><b>首相：</b>${d.player_msg}</div><div class="emperor-msg ruler"><b>${myPlayer.ruler_name}：</b>${d.emperor_reply}</div>`
    ).join('');
  }
  if (myPlayer) {
    const remaining = 3 - (myPlayer.emperor_chats_this_turn || 0);
    document.getElementById('emperor-remaining').textContent = `剩餘 ${remaining}/3 次`;
  }
}

function renderVetoes() {
  const el = document.getElementById('veto-list');
  if (!myPlayer || !myPlayer.vetoes || !myPlayer.vetoes.length) {
    el.innerHTML = '<p style="color:var(--muted)">尚無否決紀錄</p>';
    return;
  }
  el.innerHTML = myPlayer.vetoes.slice(-5).map(v => 
    `<div class="veto-box"><b>第 ${v.turn} 回合</b> — ${v.reason || ''}<br><span style="color:var(--muted)">被否決的決策：${v.decision || '?'}</span></div>`
  ).join('');
}

function renderPlayers() {
  const el = document.getElementById('player-grid');
  if (!gameState.players || Object.keys(gameState.players).length === 0) {
    el.innerHTML = '<p style="color:var(--muted)">尚無玩家加入</p>';
    return;
  }
  el.innerHTML = Object.values(gameState.players).map(p => {
    const govTag = p.government === 'monarchy' ? 'tag-monarchy' : 'tag-republic';
    const govIcon = p.government === 'monarchy' ? '👑 帝制' : '🏛️ 共和';
    const status = p.alive === false ? '<span class="tag tag-dead">☠️ 垮台</span>' : '<span class="tag tag-alive">✅ 存活</span>';
    return `<div class="player-card"><h3>${p.country}</h3><p style="color:var(--muted);font-size:0.85em">${p.name}</p><div style="margin-top:6px"><span class="tag ${govTag}">${govIcon}</span>${status}</div>${p.ruler_name ? `<p style="color:var(--muted);font-size:0.8em;margin-top:4px">統治者：${p.ruler_name}</p>` : ''}</div>`;
  }).join('');
}

function renderAdmin() {
  const el = document.getElementById('api-settings');
  el.innerHTML = '';
  for (let i = 1; i <= 3; i++) {
    el.innerHTML += `<div style="margin-bottom:10px;padding:10px;border:1px solid var(--border);border-radius:6px"><h3 style="margin-bottom:8px">Tier ${i}</h3><div class="form-group"><label>API URL</label><input id="api-t${i}-url" placeholder="https://api.example.com/v1" /></div><div class="form-group"><label>API Key</label><input id="api-t${i}-key" type="password" placeholder="sk-..." /></div><div class="form-group"><label>Model</label><input id="api-t${i}-model" placeholder="model-name" /></div></div>`;
  }
  loadApiSettings();
}

async function loadApiSettings() {
  try {
    const data = await api('/api/ww1/settings');
    for (let i = 1; i <= 3; i++) {
      const cfg = data[`api_tier_${i}`] || {};
      document.getElementById(`api-t${i}-url`).value = cfg.url || '';
      document.getElementById(`api-t${i}-key`).value = cfg.key || '';
      document.getElementById(`api-t${i}-model`).value = cfg.model || '';
    }
  } catch(e) { console.error(e); }
}

async function saveApiSettings() {
  const data = {};
  for (let i = 1; i <= 3; i++) {
    data[`api_tier_${i}`] = {
      url: document.getElementById(`api-t${i}-url`).value.trim(),
      key: document.getElementById(`api-t${i}-key`).value.trim(),
      model: document.getElementById(`api-t${i}-model`).value.trim(),
    };
  }
  try {
    await api('/api/ww1/settings', 'PUT', data);
    alert('✅ API 設定已儲存');
  } catch(e) { alert('❌ 儲存失敗：' + e.message); }
}

async function joinGame() {
  const country = document.getElementById('country-select').value;
  if (!country) { alert('請選擇國家'); return; }
  try {
    await api('/api/ww1/join', 'POST', { country, name: 'Player' });
    alert(`✅ 已加入：${country}`);
    refreshState();
  } catch(e) { alert('❌ ' + e.message); }
}

async function submitPolicy() {
  const type = document.getElementById('policy-type').value;
  const action = document.getElementById('policy-action').value.trim();
  if (!action) { alert('請輸入決策內容'); return; }
  try {
    await api('/api/ww1/policy', 'POST', { type, action });
    document.getElementById('policy-action').value = '';
    refreshState();
  } catch(e) { alert('❌ ' + e.message); }
}

async function talkToEmperor() {
  const msg = document.getElementById('emperor-message').value.trim();
  if (!msg) { alert('請輸入訊息'); return; }
  try {
    const data = await api('/api/ww1/emperor', 'POST', { message: msg });
    document.getElementById('emperor-message').value = '';
    refreshState();
  } catch(e) { alert('❌ ' + e.message); }
}

async function advanceTurn() {
  document.getElementById('advance-status').textContent = '⏳ 處理中...';
  try {
    const data = await api('/api/ww1/advance', 'POST');
    document.getElementById('advance-status').textContent = `✅ 第 ${data.turn} 回合`;
    refreshState();
  } catch(e) {
    document.getElementById('advance-status').textContent = '❌ ' + e.message;
  }
}

init();
</script>
</body>
</html>
