services:
  - type: worker
    name: discord-borda-poll-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python discord_borda_poll.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GITHUB_TOKEN
        sync: false
      - key: SELF_URL
        sync: false
