<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 AI 寫小說工具</title>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--text:#eee;--muted:#999;--border:#333;--green:#4ecca3;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px;max-width:1200px;margin:0 auto}
h1{color:var(--accent);margin-bottom:10px}
h2{color:var(--green);margin:15px 0 10px}
.muted{color:var(--muted);font-size:.85em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:15px}
input,select,textarea,button{font-family:inherit;font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:100%}
textarea{min-height:80px;resize:vertical}
button{cursor:pointer;background:var(--card);color:var(--text);border:1px solid var(--accent);transition:.2s}
button:hover{background:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
button.small{width:auto;padding:4px 12px}
button.danger{border-color:#c0392b}
button.danger:hover{background:#c0392b}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.form-group{margin-bottom:10px}
.form-group label{display:block;margin-bottom:4px;color:var(--muted);font-size:.85em}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--accent)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.8em;margin:2px}
.tag-protagonist{background:#2d6a4f;color:#fff}
.tag-supporting{background:#40916c;color:#fff}
.tag-antagonist{background:#9d0208;color:#fff}
.tag-minor{background:#6c757d;color:#fff}
.tabs{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-bottom:none}
.tab.active{background:var(--card);border-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.chapter-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px}
.chapter-box h3{color:var(--green);margin-bottom:8px}
.chapter-content{white-space:pre-wrap;line-height:1.8;margin:10px 0;max-height:500px;overflow-y:auto}
.stat{display:inline-block;margin-right:15px;color:var(--muted);font-size:.85em}
.login-box{max-width:400px;margin:100px auto;text-align:center}
.login-box input{text-align:center}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:10px 0}
.progress-fill{height:100%;background:var(--green);transition:width .3s}
.outline-chapter{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px}
.outline-chapter input,.outline-chapter textarea{margin-bottom:6px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.checkbox-group label{display:flex;align-items:center;gap:4px;background:var(--bg);padding:6px 10px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:.9em}
.checkbox-group input{width:auto}
.char-select{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.char-select select{width:auto;flex:1}
.role-select{width:auto;min-width:100px}
.char-row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--border)}
.char-row .char-info{flex:1}
.char-row select{width:auto;min-width:100px}
.rel-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.rel-row .rel-info{flex:1}
#toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;background:var(--card);color:var(--text);border:1px solid var(--accent);display:none;z-index:999;max-width:350px}
.pd-section{margin-bottom:20px}
</style>
</head>
<body>

<div id="toast"></div>

<!-- 登入 -->
<div id="login-view" class="login-box">
<h1>📖 AI 寫小說工具</h1>
<p class="muted">請輸入您的 Discord ID 以驗證身份</p>
<br>
<input type="text" id="login-input" placeholder="Discord ID" onkeydown="if(event.key==='Enter')doLogin()">
<br><br>
<button onclick="doLogin()">登入</button>
</div>

<!-- 主介面 -->
<div id="main-view" style="display:none">

<div style="display:flex;justify-content:space-between;align-items:center">
<h1>📖 AI 寫小說工具</h1>
<button class="small" onclick="logout()">登出</button>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('settings')">⚙️ 設定</div>
<div class="tab" onclick="showTab('characters')">👤 角色庫</div>
<div class="tab" onclick="showTab('projects')">📚 專案</div>
</div>

<!-- 設定 -->
<div id="tab-settings" class="tab-content active">
<div class="card">
<h2>API 設定</h2>
<div class="form-group">
<label>API 類型</label>
<select id="set-api-type">
<option value="openai">OpenAI 相容</option>
<option value="gemini">Google Gemini</option>
</select>
</div>
<div class="form-group">
<label>API Base URL</label>
<input type="text" id="set-api-url" placeholder="https://api.openai.com">
</div>
<div class="form-group">
<label>API Key</label>
<input type="password" id="set-api-key" placeholder="留空表示不修改">
</div>
<div class="form-group">
<label>模型名稱</label>
<input type="text" id="set-model" placeholder="gpt-4o / gemini-2.0-flash 等">
</div>
<div class="row">
<div class="form-group">
<label>Temperature</label>
<input type="number" id="set-temp" step="0.1" min="0" max="2" value="0.8">
</div>
<div class="form-group">
<label>Max Tokens</label>
<input type="number" id="set-max-tokens" value="4096">
</div>
</div>
<button onclick="saveSettings()">儲存設定</button>
<span id="settings-status" class="muted"></span>
</div>
</div>

<!-- 角色庫 -->
<div id="tab-characters" class="tab-content">
<div class="card">
<h2>新增角色</h2>
<div class="row">
<div class="form-group">
<label>名字</label>
<input type="text" id="char-name">
</div>
<div class="form-group">
<label>預設定位</label>
<select id="char-role">
<option value="protagonist">主角</option>
<option value="supporting">配角</option>
<option value="antagonist">反派</option>
<option value="minor">次要角色</option>
</select>
</div>
</div>
<div class="form-group">
<label>性格描述</label>
<textarea id="char-personality" placeholder="性格特徵、優缺點等"></textarea>
</div>
<div class="form-group">
<label>背景故事</label>
<textarea id="char-background" placeholder="角色背景"></textarea>
</div>
<div class="form-group">
<label>外貌描述</label>
<input type="text" id="char-appearance" placeholder="外貌特徵">
</div>
<div class="form-group">
<label>備註</label>
<input type="text" id="char-notes" placeholder="其他補充">
</div>
<button onclick="addCharacter()">新增角色</button>
</div>

<div id="char-list" class="card">
<h2>角色列表</h2>
<p class="muted">載入中...</p>
</div>
</div>

<!-- 專案 -->
<div id="tab-projects" class="tab-content">
<div id="projects-list-view">
<div class="card">
<h2>新增專案</h2>
<div class="form-group">
<label>小說標題</label>
<input type="text" id="proj-title">
</div>
<div class="row">
<div class="form-group">
<label>題材類型</label>
<input type="text" id="proj-genre" placeholder="奇幻、科幻、懸疑...">
</div>
<div class="form-group">
<label>章節數</label>
<input type="number" id="proj-chapters" value="10" min="1">
</div>
<div class="form-group">
<label>每章字數</label>
<input type="number" id="proj-words" value="3000" min="500" step="500">
</div>
</div>
<div class="form-group">
<label>整體概念 / 題材大綱</label>
<textarea id="proj-concept" placeholder="描述這部小說的核心概念、主要劇情方向、世界觀等"></textarea>
</div>
<div class="form-group">
<label>使用角色（可在專案中再調整定位）</label>
<div id="proj-char-select" class="checkbox-group"></div>
</div>
<button onclick="createProject()">建立專案</button>
</div>

<div id="proj-list" class="card">
<h2>專案列表</h2>
<p class="muted">載入中...</p>
</div>
</div>

<div id="project-detail-view" style="display:none">
<button class="small" onclick="backToProjects()" style="margin-bottom:15px">← 返回列表</button>

<div class="card">
<h2 id="pd-title"></h2>
<p id="pd-info" class="muted"></p>
</div>

<!-- 專案角色管理（per-project role） -->
<div class="card pd-section">
<h2>👤 專案角色與定位</h2>
<p class="muted">每個角色可在不同專案中設定不同定位（主角/配角/反派等）</p>
<div style="margin:10px 0">
<div class="row" style="align-items:flex-end">
<div class="form-group" style="flex:1">
<label>加入角色到專案</label>
<select id="pd-add-char-select"></select>
</div>
<button class="small" onclick="addCharToProject()" style="width:auto;margin-bottom:10px">加入</button>
</div>
</div>
<div id="pd-char-list"></div>
</div>

<!-- 專案關係鏈（per-project） -->
<div class="card pd-section">
<h2>🔗 專案關係鏈</h2>
<p class="muted">在此專案中角色之間的關係，獨立於其他專案</p>
<div style="margin:10px 0">
<div class="char-select">
<select id="pd-rel-a"></select>
<span>→</span>
<select id="pd-rel-b"></select>
</div>
<div class="row">
<div class="form-group">
<label>關係類型</label>
<input type="text" id="pd-rel-type" placeholder="例：戀人、仇敵、主僕、父子...">
</div>
<div class="form-group">
<label>方向性</label>
<select id="pd-rel-direction">
<option value="mutual">雙向</option>
<option value="a_to_b">A → B</option>
<option value="b_to_a">B → A</option>
</select>
</div>
</div>
<div class="form-group">
<label>關係描述</label>
<input type="text" id="pd-rel-desc" placeholder="關係的具體描述">
</div>
<button class="small" onclick="addProjectRelationship()">新增關係</button>
</div>
<div id="pd-rel-list"></div>
</div>

<!-- 大綱區 -->
<div class="card" id="outline-section">
<h2>📋 分章大綱</h2>
<div class="row" style="margin-bottom:10px">
<button onclick="generateOutline()" id="btn-gen-outline">🤖 AI 生成大綱</button>
<button onclick="saveOutline()" id="btn-save-outline">儲存大綱</button>
<button onclick="confirmOutline()" id="btn-confirm-outline">✅ 確認大綱並開始生成</button>
</div>
<div id="gen-outline-progress" style="display:none;margin-bottom:10px">
<div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
<p class="progress-text muted" style="margin-top:4px">準備中...</p>
</div>
<div id="outline-editor"></div>
</div>

<!-- 生成區 -->
<div class="card" id="generation-section" style="display:none">
<h2>✍️ 章節生成</h2>
<div class="progress-bar"><div class="progress-fill" id="gen-progress" style="width:0%"></div></div>
<p id="gen-status" class="muted">點擊下方按鈕開始生成</p>
<div class="row" style="margin-bottom:10px">
<button onclick="generateAllChapters()" id="btn-gen-all">生成全部章節</button>
<button onclick="exportNovel()">📥 匯出全文</button>
</div>
<div id="chapters-display"></div>
</div>
</div>
</div>

</div>

<script>
const OWNER_ID="1482256878334640209";
let AUTH_TOKEN=localStorage.getItem('novel_auth')||"";
let characters=[],projects=[],currentProject=null;

const ROLE_LABELS={protagonist:'主角',supporting:'配角',antagonist:'反派',minor:'次要角色'};

// ─── API helper ───
async function api(path,method='GET',body=null){
  const opts={method,headers:{'X-Auth':AUTH_TOKEN,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  if(r.status===401){logout();throw new Error('未授權')}
  return r.json();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

// ─── Auth ───
function doLogin(){
  const v=document.getElementById('login-input').value.trim();
  if(v===OWNER_ID){
    AUTH_TOKEN=v;
    localStorage.setItem('novel_auth',v);
    showMain();
  }else{
    toast('Discord ID 不正確');
  }
}
function logout(){
  AUTH_TOKEN="";localStorage.removeItem('novel_auth');
  document.getElementById('main-view').style.display='none';
  document.getElementById('login-view').style.display='block';
  document.getElementById('login-input').value='';
}
function showMain(){
  document.getElementById('login-view').style.display='none';
  document.getElementById('main-view').style.display='block';
  loadAll();
}

// ─── Tabs ───
function showTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const tabs=['settings','characters','projects'];
    t.classList.toggle('active',tabs[i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='characters')loadCharacters();
  if(name==='projects')loadProjects();
}

// ─── Settings ───
async function loadSettings(){
  try{
    const s=await api('/api/novel/settings');
    document.getElementById('set-api-type').value=s.api_type||'openai';
    document.getElementById('set-api-url').value=s.api_url||'';
    document.getElementById('set-model').value=s.model||'';
    document.getElementById('set-temp').value=s.temperature||0.8;
    document.getElementById('set-max-tokens').value=s.max_tokens||4096;
    if(s.api_key_masked)document.getElementById('set-api-key').placeholder=s.api_key_masked;
  }catch(e){toast('載入設定失敗')}
}
async function saveSettings(){
  try{
    const data={
      api_type:document.getElementById('set-api-type').value,
      api_url:document.getElementById('set-api-url').value,
      model:document.getElementById('set-model').value,
      temperature:parseFloat(document.getElementById('set-temp').value),
      max_tokens:parseInt(document.getElementById('set-max-tokens').value),
    };
    const k=document.getElementById('set-api-key').value;
    if(k)data.api_key=k;
    await api('/api/novel/settings','PUT',data);
    toast('✅ 設定已儲存');
    document.getElementById('set-api-key').value='';
  }catch(e){toast('儲存失敗')}
}

// ─── Characters (全域角色庫) ───
async function loadCharacters(){
  try{
    characters=await api('/api/novel/characters');
    renderCharacters();
    updateProjCharSelect();
  }catch(e){toast('載入角色失敗')}
}
function renderCharacters(){
  const div=document.getElementById('char-list');
  if(!characters.length){div.innerHTML='<h2>角色列表</h2><p class="muted">尚無角色</p>';return}
  div.innerHTML='<h2>角色列表</h2>'+characters.map(c=>`
    <div class="card" style="border-color:var(--accent)">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div style="flex:1">
          <h3>${esc(c.name)} <span class="tag tag-${c.role}">${ROLE_LABELS[c.role]||c.role}</span></h3>
          ${c.personality?`<p><span class="muted">性格：</span>${esc(c.personality)}</p>`:''}
          ${c.background?`<p><span class="muted">背景：</span>${esc(c.background)}</p>`:''}
          ${c.appearance?`<p><span class="muted">外貌：</span>${esc(c.appearance)}</p>`:''}
          ${c.notes?`<p><span class="muted">備註：</span>${esc(c.notes)}</p>`:''}
        </div>
        <button class="small danger" onclick="deleteCharacter('${c.id}')">刪除</button>
      </div>
    </div>`).join('');
}
async function addCharacter(){
  const data={
    name:val('char-name'),role:val('char-role'),personality:val('char-personality'),
    background:val('char-background'),appearance:val('char-appearance'),notes:val('char-notes')
  };
  if(!data.name){toast('請輸入名字');return}
  try{
    await api('/api/novel/characters','POST',data);
    ['char-name','char-personality','char-background','char-appearance','char-notes'].forEach(clear);
    toast('✅ 角色已新增');
    loadCharacters();
  }catch(e){toast('新增失敗')}
}
async function deleteCharacter(id){
  if(!confirm('確定刪除？所有專案中的此角色和相關關係也會被移除'))return;
  try{await api('/api/novel/characters/'+id,'DELETE');toast('已刪除');loadCharacters()}
  catch(e){toast('刪除失敗')}
}

// ─── Projects ───
function updateProjCharSelect(){
  const pcs=document.getElementById('proj-char-select');
  if(!pcs)return;
  const checked=Array.from(pcs.querySelectorAll('input:checked')).map(i=>i.value);
  pcs.innerHTML=characters.map(c=>`<label><input type="checkbox" value="${c.id}" ${checked.includes(c.id)?'checked':''}> ${esc(c.name)}</label>`).join('');
}

async function loadProjects(){
  try{
    projects=await api('/api/novel/projects');
    renderProjects();
  }catch(e){toast('載入專案失敗')}
}
function renderProjects(){
  const div=document.getElementById('proj-list');
  if(!projects.length){div.innerHTML='<h2>專案列表</h2><p class="muted">尚無專案</p>';return}
  div.innerHTML='<h2>專案列表</h2>'+projects.map(p=>`
    <div class="card" style="cursor:pointer;border-color:var(--accent)" onclick="openProject('${p.id}')">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div>
          <h3>${esc(p.title)}</h3>
          <span class="stat">題材：${esc(p.genre)}</span>
          <span class="stat">角色：${p.characters_count||0}</span>
          <span class="stat">關係：${p.relationships_count||0}</span>
          <span class="stat">大綱：${p.outline_count} 章 ${p.outline_confirmed?'✅':'⏳'}</span>
          <span class="stat">已生成：${p.chapters_count}/${p.total_chapters} 章</span>
          <span class="stat">建立：${esc(p.created_at)}</span>
        </div>
        <div onclick="event.stopPropagation()">
          <button class="small danger" onclick="deleteProject('${p.id}')">刪除</button>
        </div>
      </div>
      ${p.concept?`<p class="muted" style="margin-top:5px">${esc(p.concept.substring(0,100))}${p.concept.length>100?'...':''}</p>`:''}
    </div>`).join('');
}
async function createProject(){
  const charIds=Array.from(document.querySelectorAll('#proj-char-select input:checked')).map(i=>i.value);
  const data={
    title:val('proj-title'),genre:val('proj-genre'),concept:val('proj-concept'),
    character_ids:charIds,total_chapters:parseInt(val('proj-chapters')),
    words_per_chapter:parseInt(val('proj-words'))
  };
  if(!data.title){toast('請輸入標題');return}
  try{
    await api('/api/novel/projects','POST',data);
    ['proj-title','proj-genre','proj-concept'].forEach(clear);
    toast('✅ 專案已建立');
    loadProjects();
  }catch(e){toast('建立失敗')}
}
async function deleteProject(id){
  if(!confirm('確定刪除此專案？所有已生成的章節也會被刪除'))return;
  try{await api('/api/novel/projects/'+id,'DELETE');toast('已刪除');loadProjects()}
  catch(e){toast('刪除失敗')}
}

// ─── Project Detail ───
async function openProject(id){
  try{
    currentProject=await api('/api/novel/projects/'+id);
    document.getElementById('projects-list-view').style.display='none';
    document.getElementById('project-detail-view').style.display='block';
    document.getElementById('pd-title').textContent=currentProject.title;
    updateProjectInfo();
    renderProjectChars();
    renderProjectRels();
    renderOutline();
    renderChapters();
    updateGenUI();
    updatePdAddCharSelect();
    updatePdRelSelects();
  }catch(e){toast('載入專案失敗')}
}
function updateProjectInfo(){
  const chars=currentProject.characters||[];
  document.getElementById('pd-info').innerHTML=
    `題材：${esc(currentProject.genre)} | 角色：${chars.length} 人 | `+
    `關係：${(currentProject.relationships||[]).length} 條 | `+
    `大綱：${currentProject.outline.length} 章 ${currentProject.outline_confirmed?'✅已確認':'⏳未確認'} | `+
    `已生成：${currentProject.chapters.length}/${currentProject.generation_config.total_chapters} 章`;
}
function backToProjects(){
  document.getElementById('projects-list-view').style.display='block';
  document.getElementById('project-detail-view').style.display='none';
  currentProject=null;loadProjects();
}

// ─── 專案角色管理（per-project role）───
function getCharName(id){
  const c=characters.find(c=>c.id===id);
  return c?c.name:'?';
}
function getCharInfo(id){
  const c=characters.find(c=>c.id===id);
  return c||null;
}

function updatePdAddCharSelect(){
  const sel=document.getElementById('pd-add-char-select');
  const inProject=new Set((currentProject.characters||[]).map(c=>c.id));
  const available=characters.filter(c=>!inProject.has(c.id));
  sel.innerHTML=available.length
    ? available.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')
    : '<option value="">（所有角色已加入）</option>';
}

function renderProjectChars(){
  const div=document.getElementById('pd-char-list');
  const chars=currentProject.characters||[];
  if(!chars.length){div.innerHTML='<p class="muted">尚無角色，請從上方加入</p>';return}
  div.innerHTML=chars.map(pc=>{
    const info=getCharInfo(pc.id);
    const name=info?info.name:'?（已刪除）';
    return `
    <div class="char-row">
      <div class="char-info">
        <strong>${esc(name)}</strong>
        ${info&&info.personality?`<br><span class="muted">${esc(info.personality.substring(0,60))}${info.personality.length>60?'...':''}</span>`:''}
      </div>
      <select onchange="updateCharRole('${pc.id}',this.value)" class="role-select">
        <option value="protagonist" ${pc.role==='protagonist'?'selected':''}>主角</option>
        <option value="supporting" ${pc.role==='supporting'?'selected':''}>配角</option>
        <option value="antagonist" ${pc.role==='antagonist'?'selected':''}>反派</option>
        <option value="minor" ${pc.role==='minor'?'selected':''}>次要角色</option>
      </select>
      <button class="small danger" onclick="removeCharFromProject('${pc.id}')" style="width:auto">移除</button>
    </div>`;
  }).join('');
}

async function updateCharRole(charId,newRole){
  try{
    await api(`/api/novel/projects/${currentProject.id}/characters/${charId}/role`,'PUT',{role:newRole});
    const pc=(currentProject.characters||[]).find(c=>c.id===charId);
    if(pc)pc.role=newRole;
    toast('✅ 定位已更新');
  }catch(e){toast('更新失敗')}
}
async function addCharToProject(){
  const sel=document.getElementById('pd-add-char-select');
  const charId=sel.value;
  if(!charId){toast('沒有可加入的角色');return}
  try{
    await api(`/api/novel/projects/${currentProject.id}/characters`,'POST',{character_id:charId});
    // 更新本地資料
    const c=characters.find(c=>c.id===charId);
    currentProject.characters=currentProject.characters||[];
    currentProject.characters.push({id:charId,role:c?c.role:'supporting'});
    updatePdAddCharSelect();
    renderProjectChars();
    updateProjectInfo();
    updatePdRelSelects();
    toast('✅ 角色已加入');
  }catch(e){toast('加入失敗')}
}
async function removeCharFromProject(charId){
  if(!confirm('確定從此專案移除？相關關係也會被刪除'))return;
  try{
    await api(`/api/novel/projects/${currentProject.id}/characters/${charId}`,'DELETE');
    currentProject.characters=(currentProject.characters||[]).filter(c=>c.id!==charId);
    currentProject.relationships=(currentProject.relationships||[]).filter(r=>r.character_a!==charId&&r.character_b!==charId);
    updatePdAddCharSelect();
    renderProjectChars();
    renderProjectRels();
    updateProjectInfo();
    updatePdRelSelects();
    toast('已移除');
  }catch(e){toast('移除失敗')}
}

// ─── 專案關係鏈（per-project）───
function updatePdRelSelects(){
  const chars=currentProject.characters||[];
  const opts=chars.map(pc=>`<option value="${pc.id}">${esc(getCharName(pc.id))}</option>`).join('');
  ['pd-rel-a','pd-rel-b'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    const cur=el.value;
    el.innerHTML=opts;
    if(cur)el.value=cur;
  });
}

function renderProjectRels(){
  const div=document.getElementById('pd-rel-list');
  const rels=currentProject.relationships||[];
  if(!rels.length){div.innerHTML='<p class="muted">尚無關係</p>';return}
  div.innerHTML=rels.map(r=>`
    <div class="rel-row">
      <div class="rel-info">
        <strong>${esc(r.character_a_name||getCharName(r.character_a))} → ${esc(r.character_b_name||getCharName(r.character_b))}</strong>
        <span class="tag" style="background:var(--card)">${esc(r.relationship_type)}</span>
        ${r.description?`<br><span class="muted">${esc(r.description)}</span>`:''}
      </div>
      <button class="small danger" onclick="deleteProjectRelationship('${r.id}')" style="width:auto">刪除</button>
    </div>`).join('');
}

async function addProjectRelationship(){
  const data={
    character_a:val('pd-rel-a'),character_b:val('pd-rel-b'),
    relationship_type:val('pd-rel-type'),description:val('pd-rel-desc'),direction:val('pd-rel-direction')
  };
  if(!data.character_a||!data.character_b||!data.relationship_type){toast('請填寫角色和關係類型');return}
  if(data.character_a===data.character_b){toast('不能選相同的角色');return}
  try{
    const r=await api(`/api/novel/projects/${currentProject.id}/relationships`,'POST',data);
    currentProject.relationships=currentProject.relationships||[];
    r.character_a_name=getCharName(r.character_a);
    r.character_b_name=getCharName(r.character_b);
    currentProject.relationships.push(r);
    renderProjectRels();
    updateProjectInfo();
    clear('pd-rel-type');clear('pd-rel-desc');
    toast('✅ 關係已新增');
  }catch(e){toast('新增失敗')}
}
async function deleteProjectRelationship(relId){
  try{
    await api(`/api/novel/projects/${currentProject.id}/relationships/${relId}`,'DELETE');
    currentProject.relationships=(currentProject.relationships||[]).filter(r=>r.id!==relId);
    renderProjectRels();
    updateProjectInfo();
    toast('已刪除');
  }catch(e){toast('刪除失敗')}
}

// ─── Outline ───
function renderOutline(){
  const div=document.getElementById('outline-editor');
  const ol=currentProject.outline||[];
  if(!ol.length){div.innerHTML='<p class="muted">尚無大綱，點擊「AI 生成大綱」開始</p>';return}
  div.innerHTML=ol.map((ch,i)=>`
    <div class="outline-chapter">
      <strong>第 ${i+1} 章</strong>
      <input type="text" value="${esc(ch.title||'')}" onchange="updateOutlineField(${i},'title',this.value)" placeholder="章節標題">
      <textarea onchange="updateOutlineField(${i},'summary',this.value)" placeholder="劇情摘要">${esc(ch.summary||'')}</textarea>
      <div class="row">
        <input type="text" value="${esc((ch.characters||[]).join(', '))}" onchange="updateOutlineField(${i},'characters',this.value.split(',').map(s=>s.trim()))" placeholder="出場角色（逗號分隔）">
        <input type="text" value="${esc(ch.mood||'')}" onchange="updateOutlineField(${i},'mood',this.value)" placeholder="情緒基調">
      </div>
    </div>`).join('');
}
function updateOutlineField(idx,field,val){
  if(currentProject.outline[idx])currentProject.outline[idx][field]=val;
}
async function generateOutline(){
  const btn=document.getElementById('btn-gen-outline');
  btn.disabled=true;btn.textContent='生成中...';
  const prog=document.getElementById('gen-outline-progress');
  const progBar=prog.querySelector('.progress-fill');
  const progText=prog.querySelector('.progress-text');
  prog.style.display='block';
  progBar.style.width='10%';
  progText.textContent='準備中...';
  try{
    const resp=await fetch(`/api/novel/projects/${currentProject.id}/generate-outline-sse`,{
      method:'POST',
      headers:{'X-Auth':AUTH_TOKEN,'Content-Type':'application/json'},
    });
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const events=buffer.split('\n\n');
      buffer=events.pop();
      for(const evt of events){
        const lines=evt.split('\n');
        let etype='',edata='';
        for(const ln of lines){
          if(ln.startsWith('event: '))etype=ln.slice(7);
          if(ln.startsWith('data: '))edata=ln.slice(6);
        }
        if(!etype)continue;
        const data=JSON.parse(edata);
        if(etype==='progress'){
          const pctMap={'building_prompt':20,'calling_ai':50,'parsing':80,'saving':90};
          progBar.style.width=(pctMap[data.stage]||85)+'%';
          progText.textContent=data.message;
        }else if(etype==='done'){
          progBar.style.width='100%';
          progText.textContent='完成！';
          currentProject.outline=data.outline;
          renderOutline();
          toast(`✅ 大綱已生成（${data.count} 章）`);
          setTimeout(()=>prog.style.display='none',1500);
        }else if(etype==='error'){
          toast(data.error);
          prog.style.display='none';
        }
      }
    }
  }catch(e){toast('生成失敗：'+e.message);prog.style.display='none'}
  finally{btn.disabled=false;btn.textContent='🤖 AI 生成大綱'}
}
async function saveOutline(){
  try{
    await api(`/api/novel/projects/${currentProject.id}`,'PUT',{outline:currentProject.outline});
    toast('✅ 大綱已儲存');
  }catch(e){toast('儲存失敗')}
}
async function confirmOutline(){
  if(!currentProject.outline.length){toast('請先生成大綱');return}
  try{
    await api(`/api/novel/projects/${currentProject.id}`,'PUT',{outline:currentProject.outline,outline_confirmed:true});
    currentProject.outline_confirmed=true;
    updateGenUI();
    toast('✅ 大綱已確認，可以開始生成章節了');
  }catch(e){toast('確認失敗')}
}

// ─── Chapter Generation ───
function updateGenUI(){
  const confirmed=currentProject.outline_confirmed;
  document.getElementById('generation-section').style.display=confirmed?'block':'none';
}
function renderChapters(){
  const div=document.getElementById('chapters-display');
  const chs=currentProject.chapters||[];
  if(!chs.length){div.innerHTML='<p class="muted">尚無已生成章節</p>';return}
  div.innerHTML=chs.map(ch=>`
    <div class="chapter-box">
      <h3>第 ${ch.chapter} 章：${esc(ch.title)} <span class="muted">(${ch.word_count||0} 字)</span></h3>
      <div class="chapter-content">${esc(ch.content)}</div>
      <div class="row">
        <button class="small" onclick="regenerateChapter(${ch.chapter},this)">🔄 重新生成</button>
      </div>
    </div>`).join('');
}
async function generateChapter(num,btn,progressCb){
  if(btn){btn.disabled=true;btn.textContent='生成中...'}
  try{
    const resp=await fetch(`/api/novel/projects/${currentProject.id}/generate-chapter-sse`,{
      method:'POST',
      headers:{'X-Auth':AUTH_TOKEN,'Content-Type':'application/json'},
      body:JSON.stringify({chapter:num}),
    });
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    let result=null;
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const events=buffer.split('\n\n');
      buffer=events.pop();
      for(const evt of events){
        const lines=evt.split('\n');
        let etype='',edata='';
        for(const ln of lines){
          if(ln.startsWith('event: '))etype=ln.slice(7);
          if(ln.startsWith('data: '))edata=ln.slice(6);
        }
        if(!etype)continue;
        const data=JSON.parse(edata);
        if(etype==='progress'){
          if(progressCb)progressCb(data);
          else if(btn)btn.textContent=data.message;
        }else if(etype==='done'){
          result=data.chapter;
        }else if(etype==='error'){
          toast(data.error);
          return null;
        }
      }
    }
    if(result){
      const idx=currentProject.chapters.findIndex(c=>c.chapter===result.chapter);
      if(idx>=0)currentProject.chapters[idx]=result;
      else{currentProject.chapters.push(result);currentProject.chapters.sort((a,b)=>a.chapter-b.chapter)}
      renderChapters();
      updateProgress();
      toast(`✅ 第 ${result.chapter} 章已生成（${result.word_count} 字）`);
    }
    return result;
  }catch(e){toast('生成失敗：'+e.message);return null}
  finally{if(btn){btn.disabled=false;btn.textContent='🔄 重新生成'}}
}
async function regenerateChapter(num,btn){
  if(!confirm(`確定重新生成第 ${num} 章？`))return;
  await generateChapter(num,btn);
}
async function generateAllChapters(){
  const total=currentProject.generation_config.total_chapters;
  const existing=new Set(currentProject.chapters.map(c=>c.chapter));
  const toGen=[];
  for(let i=1;i<=total;i++)if(!existing.has(i))toGen.push(i);
  if(!toGen.length){toast('所有章節已生成');return}
  const btn=document.getElementById('btn-gen-all');
  btn.disabled=true;
  for(let i=0;i<toGen.length;i++){
    const ch=toGen[i];
    const pct=Math.round(i/toGen.length*100);
    document.getElementById('gen-status').textContent=`正在生成第 ${ch} 章（${i+1}/${toGen.length}）...`;
    updateProgress(pct);
    const r=await generateChapter(ch,null,(data)=>{
      const subPct=Math.round((i+(data.stage==='building_prompt'?0.2:data.stage==='calling_ai'?0.5:data.stage==='summarizing'?0.8:0.9))/toGen.length*100);
      updateProgress(subPct);
      document.getElementById('gen-status').textContent=`第 ${ch} 章：${data.message}`;
    });
    if(!r){toast(`第 ${ch} 章生成失敗，已停止`);break}
  }
  btn.disabled=false;btn.textContent='生成全部章節';
  document.getElementById('gen-status').textContent='生成完成！';
  updateProgress(100);
}
function updateProgress(pct){
  if(!pct){
    const total=currentProject.generation_config.total_chapters;
    const done=currentProject.chapters.length;
    pct=done/total*100;
  }
  document.getElementById('gen-progress').style.width=pct+'%';
}
async function exportNovel(){
  try{
    const r=await api(`/api/novel/projects/${currentProject.id}/export`);
    const blob=new Blob([r.text],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(r.title||'novel')+'.txt';
    a.click();
    toast('✅ 已匯出');
  }catch(e){toast('匯出失敗')}
}

// ─── Utils ───
function val(id){return document.getElementById(id).value.trim()}
function clear(id){document.getElementById(id).value=''}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ─── Init ───
async function loadAll(){
  await loadSettings();
  await loadCharacters();
  await loadProjects();
}
if(AUTH_TOKEN===OWNER_ID)showMain();
</script>
